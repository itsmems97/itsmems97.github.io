<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PIKA STORE">
<meta name="theme-color" content="#ffd6e8">
<meta name="robots" content="noindex, nofollow">
<title>PIKA STORE — Maintenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  html,body{
    height:100%;
    width:100%;
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-overflow-scrolling:none;
  }

  body{
    margin:0;
    font-family:'Quicksand',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:#6b2c4d;
    background:linear-gradient(160deg,#fff0f6 0%,#ffe4ef 40%,#ffd6e8 100%);

    /* ---- APP FEEL: no select, no copy, no long-press ---- */
    -webkit-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    -webkit-user-drag:none;
    touch-action:manipulation;
    cursor:default;

    display:grid;
    place-items:center;
    padding:clamp(12px,3.5vw,28px);
    -webkit-font-smoothing:antialiased;
    position:relative;
    text-rendering:optimizeLegibility;
  }

  /* disable selection on everything */
  *:not(input):not(textarea){
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }

  /* ---------- soft floating blobs (SMALLER + CONTAINED) ---------- */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:float 18s ease-in-out infinite}
  .b1{width:300px;height:300px;background:#ffb3d1;top:-90px;left:-90px}
  .b2{width:280px;height:280px;background:#ffc9e5;bottom:-100px;right:-80px;animation-delay:-6s}
  .b3{width:220px;height:220px;background:#ffd9ec;top:44%;left:60%;animation-delay:-10s}
  @keyframes float{
    0%,100%{transform:translate3d(0,0,0) scale(1)}
    50%{transform:translate3d(0,-26px,0) scale(1.06)}
  }

  /* ---------- floating hearts & sparkles ---------- */
  .floaty{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .floaty span{
    position:absolute;bottom:-40px;
    font-size:20px;opacity:0;
    animation:rise linear infinite;
    filter:drop-shadow(0 3px 6px rgba(255,120,180,.3));
  }
  @keyframes rise{
    0%{transform:translateY(0) rotate(0deg) scale(.7);opacity:0}
    10%{opacity:.85}
    90%{opacity:.85}
    100%{transform:translateY(-115vh) rotate(360deg) scale(1.05);opacity:0}
  }

  /* ---------- card (COMPACT) ---------- */
  .card{
    position:relative;z-index:2;
    width:min(520px,100%);
    max-height:calc(100vh - 32px);
    overflow:hidden;
    background:linear-gradient(180deg,rgba(255,255,255,.88),rgba(255,245,250,.75));
    border:1px solid rgba(255,255,255,.9);
    border-radius:32px;
    padding:clamp(24px,4.5vw,40px) clamp(20px,4vw,36px);
    text-align:center;
    backdrop-filter:blur(20px) saturate(140%);
    -webkit-backdrop-filter:blur(20px) saturate(140%);
    box-shadow:
      0 24px 60px rgba(255,120,180,.25),
      0 6px 18px rgba(255,160,200,.15),
      inset 0 1px 0 rgba(255,255,255,.95);
    animation:cardIn .7s cubic-bezier(.2,.8,.25,1);
  }
  @keyframes cardIn{
    from{opacity:0;transform:translateY(14px) scale(.98)}
    to{opacity:1;transform:none}
  }

  /* cute bow */
  .card::before{
    content:"";
    position:absolute;top:-12px;left:50%;transform:translateX(-50%);
    width:56px;height:24px;
    background:
      radial-gradient(circle at 25% 50%, #ff8fbd 0 34%, transparent 36%),
      radial-gradient(circle at 75% 50%, #ff8fbd 0 34%, transparent 36%),
      radial-gradient(circle at 50% 50%, #ff6fa8 0 12%, transparent 14%);
    filter:drop-shadow(0 4px 8px rgba(255,110,170,.35));
  }

  /* ---------- badge ---------- */
  .badge{
    display:inline-flex;align-items:center;gap:8px;
    font-size:10.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
    color:#b2367a;
    background:linear-gradient(180deg,#ffe0ee,#ffd0e4);
    border:1px solid rgba(255,140,190,.5);
    padding:7px 14px;border-radius:999px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 3px 10px rgba(255,150,200,.22);
  }
  .badge .dot{
    width:8px;height:8px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #ff9ec7, #ff4d94);
    animation:pulse 1.8s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(255,110,170,.6)}
    70%{box-shadow:0 0 0 9px rgba(255,110,170,0)}
    100%{box-shadow:0 0 0 0 rgba(255,110,170,0)}
  }

  /* ============================================================
     MAINTENANCE SCENE — compact, contained, no overflow
     ============================================================ */
  .icon{
    position:relative;
    width:130px;height:130px;
    margin:16px auto 8px;
    overflow:visible;
  }

  .icon .halo{
    position:absolute;inset:14px;border-radius:50%;
    background:radial-gradient(circle at 50% 45%, rgba(255,160,205,.55), transparent 68%);
    animation:halo 3.4s ease-in-out infinite;
  }
  @keyframes halo{
    0%,100%{transform:scale(.94);opacity:.75}
    50%{transform:scale(1.05);opacity:1}
  }

  .icon .gear{
    position:absolute;
    filter:drop-shadow(0 6px 12px rgba(255,90,150,.4));
    will-change:transform;
  }

  /* big gear */
  .icon .gear-big{
    width:74px;height:74px;
    top:28px;left:28px;
    animation:spinCW 9s linear infinite;
  }
  @keyframes spinCW{to{transform:rotate(360deg)}}

  /* small gear */
  .icon .gear-small{
    width:42px;height:42px;
    top:4px;right:4px;
    filter:drop-shadow(0 5px 10px rgba(255,120,180,.5));
    animation:spinCCW 4.5s linear infinite;
  }
  @keyframes spinCCW{to{transform:rotate(-360deg)}}

  /* wrench */
  .icon .wrench{
    position:absolute;
    width:52px;height:52px;
    bottom:2px;left:2px;
    filter:drop-shadow(0 6px 12px rgba(255,90,150,.5));
    transform-origin:70% 30%;
    animation:wrenchWiggle 2.4s ease-in-out infinite;
  }
  @keyframes wrenchWiggle{
    0%,100%{transform:rotate(-22deg) translateY(0)}
    50%{transform:rotate(6deg) translateY(-3px)}
  }

  /* screwdriver */
  .icon .driver{
    position:absolute;
    width:36px;height:36px;
    top:10px;left:-2px;
    filter:drop-shadow(0 5px 10px rgba(255,90,150,.45));
    transform-origin:80% 80%;
    animation:driverWiggle 3s ease-in-out infinite;
  }
  @keyframes driverWiggle{
    0%,100%{transform:rotate(18deg) translateY(0)}
    50%{transform:rotate(-8deg) translateY(-3px)}
  }

  /* sparkles */
  .icon .spark{
    position:absolute;
    color:#ffd166;line-height:1;
    filter:drop-shadow(0 0 6px rgba(255,209,102,.95));
    animation:twinkle 2.4s ease-in-out infinite;
  }
  .icon .sp1{top:-2px;left:20px;font-size:16px;animation-delay:0s}
  .icon .sp2{top:-4px;right:22px;font-size:12px;animation-delay:.5s}
  .icon .sp3{bottom:-2px;right:10px;font-size:16px;animation-delay:1s}
  .icon .sp4{bottom:14px;left:0;font-size:12px;animation-delay:1.5s}

  @keyframes twinkle{
    0%,100%{transform:scale(.55) rotate(0deg);opacity:.35}
    50%{transform:scale(1.15) rotate(180deg);opacity:1}
  }

  /* ---------- text ---------- */
  .brand{
    font-family:'Pacifico',cursive;
    font-size:clamp(26px,5.4vw,40px);
    color:#c62a72;
    margin:12px 0 4px;
    letter-spacing:.5px;
    text-shadow:0 2px 0 rgba(255,255,255,.9), 0 6px 18px rgba(255,120,180,.32);
    line-height:1.1;
  }

  .divider{
    display:flex;align-items:center;justify-content:center;
    gap:10px;margin:16px 0 18px;
    color:#ff8fbd;font-size:13px;
  }
  .divider::before,
  .divider::after{
    content:"";height:1px;width:50px;
    background:linear-gradient(90deg,transparent,#ffb3d1,transparent);
  }

  .msg{
    margin:0 auto;max-width:38ch;
    color:#8a4c6c;
    line-height:1.7;
    font-size:14.5px;
    font-weight:500;
  }
  .msg .line1{display:block;margin-bottom:5px}
  .msg .line2{display:block;color:#b2367a;font-weight:700}

  /* ---------- buttons ---------- */
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px}
  .btn{
    appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:13.5px;
    padding:12px 22px;border-radius:14px;text-decoration:none;
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    transition:transform .18s cubic-bezier(.2,.8,.25,1), box-shadow .25s ease, background .25s ease;
    letter-spacing:.02em;
    -webkit-user-select:none;user-select:none;
  }
  .btn:active{transform:translateY(2px) scale(.98)}
  .btn:focus-visible{outline:3px solid rgba(255,110,170,.5);outline-offset:3px}
  .primary{
    background:linear-gradient(180deg,#ff8fbd,#ff4d94);
    color:#fff;
    box-shadow:
      0 8px 20px rgba(255,90,150,.42),
      inset 0 1px 0 rgba(255,255,255,.5),
      inset 0 -3px 0 rgba(180,20,90,.25);
  }
  .primary:hover{
    box-shadow:
      0 12px 26px rgba(255,90,150,.55),
      inset 0 1px 0 rgba(255,255,255,.55),
      inset 0 -3px 0 rgba(180,20,90,.3);
    transform:translateY(-2px);
  }
  .ghost{
    background:rgba(255,255,255,.72);
    color:#b2367a;
    border:1px solid rgba(255,150,200,.55);
    box-shadow:0 5px 14px rgba(255,150,200,.18), inset 0 1px 0 rgba(255,255,255,.9);
  }
  .ghost:hover{background:#fff;transform:translateY(-2px)}

  .hint{margin:18px 0 0;font-size:12px;color:#b26b8e;font-weight:600}
  .hint b{color:#c62a72}

  .footer-hearts{
    margin-top:20px;
    display:flex;justify-content:center;gap:9px;
    font-size:15px;opacity:.8;
  }
  .footer-hearts span{animation:hop 2s ease-in-out infinite}
  .footer-hearts span:nth-child(2){animation-delay:.2s}
  .footer-hearts span:nth-child(3){animation-delay:.4s}
  .footer-hearts span:nth-child(4){animation-delay:.6s}
  .footer-hearts span:nth-child(5){animation-delay:.8s}
  @keyframes hop{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-4px)}
  }

  /* ---- small screens ---- */
  @media (max-height:640px){
    .icon{width:110px;height:110px;margin:10px auto 6px}
    .icon .gear-big{width:64px;height:64px;top:24px;left:24px}
    .icon .gear-small{width:36px;height:36px}
    .icon .wrench{width:44px;height:44px}
    .icon .driver{width:30px;height:30px}
    .brand{font-size:clamp(22px,5vw,32px)}
    .divider{margin:12px 0 14px}
    .actions{margin-top:20px}
    .footer-hearts{margin-top:14px}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>

<body data-maintenance="on">
<!-- MAINTENANCE_MARKER -->

<div class="bg" aria-hidden="true">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
</div>

<div class="floaty" id="floaty" aria-hidden="true"></div>

<main class="card" role="main">
  <div class="badge"><span class="dot"></span> Maintenance Mode</div>

  <!-- ============ MAINTENANCE SCENE ============ -->
  <div class="icon" aria-hidden="true">
    <div class="halo"></div>

    <!-- BIG GEAR — clockwise -->
    <svg class="gear gear-big" viewBox="0 0 24 24">
      <defs>
        <linearGradient id="gBig" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffc4dd"/>
          <stop offset="1" stop-color="#ff4d94"/>
        </linearGradient>
      </defs>
      <path fill="url(#gBig)" d="M19.14 12.94c.04-.31.06-.62.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96c-.5-.38-1.04-.7-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 0 0-.61.22L2.74 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.62-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.12.22.39.3.61.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.22.08.49 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/>
    </svg>

    <!-- SMALL GEAR — counter-clockwise -->
    <svg class="gear gear-small" viewBox="0 0 24 24">
      <defs>
        <linearGradient id="gSmall" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffe0ef"/>
          <stop offset="1" stop-color="#ff8fbd"/>
        </linearGradient>
      </defs>
      <path fill="url(#gSmall)" d="M19.14 12.94c.04-.31.06-.62.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96c-.5-.38-1.04-.7-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 0 0-.61.22L2.74 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.62-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.12.22.39.3.61.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.22.08.49 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/>
    </svg>

    <!-- WRENCH -->
    <svg class="wrench" viewBox="0 0 24 24">
      <path fill="#ffffff" stroke="#ff4d94" stroke-width="1.1" stroke-linejoin="round"
        d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/>
    </svg>

    <!-- SCREWDRIVER -->
    <svg class="driver" viewBox="0 0 24 24">
      <g transform="rotate(-40 12 12)">
        <rect x="10.6" y="3" width="2.8" height="9" rx="1.2" fill="#ff4d94"/>
        <rect x="9.6" y="11.6" width="4.8" height="2.4" rx="0.8" fill="#ffb3d1"/>
        <polygon points="10.4,14 13.6,14 13,19.4 12,21 11,19.4" fill="#ffffff" stroke="#ff4d94" stroke-width="0.9" stroke-linejoin="round"/>
      </g>
    </svg>

    <!-- SPARKLES -->
    <span class="spark sp1">✦</span>
    <span class="spark sp2">✦</span>
    <span class="spark sp3">✦</span>
    <span class="spark sp4">✦</span>
  </div>

  <h1 class="brand" id="title">PIKA STORE</h1>

  <div class="divider">♡</div>

  <p class="msg" id="message">
    <span class="line1">Dear! User This App Under Maintenance Mode</span>
    <span class="line2">Please Wait Until Maintenance Complete</span>
  </p>

  <div class="actions">
    <button class="btn primary" id="retryBtn" type="button">♡ Try again</button>
    <a class="btn ghost" id="contactBtn" href="mailto:support@example.com">✿ Contact us</a>
  </div>
  
  <!-- Owner Login (chhota link niche) -->
  <p style="margin-top:22px;text-align:center;font-size:11px;opacity:.5">
    <a href="index.html?owner=1" style="color:#b2367a;text-decoration:underline;">Owner login</a>
  </p>

  <p class="hint" id="hint">Checking again in <b>30</b>s…</p>

  <div class="footer-hearts" aria-hidden="true">
    <span>🌸</span><span>💖</span><span>🌸</span><span>💖</span><span>🌸</span>
  </div>
</main>

<script>
/* ============================================================
   ⚙️  CONFIG
   ============================================================ */
const CONFIG = {
  title:   "PIKA STORE",
  message: "Dear! User This App Under Maintenance Mode — Please Wait Until Maintenance Complete",
  whatsappNumber: "923041891897",
  contactLabel: "✿ Contact us",
  autoCheck: true,
  autoCheckSeconds: 30
};

const $ = (sel) => document.querySelector(sel);

document.title = "PIKA STORE — Maintenance";
$("#title").textContent = CONFIG.title;

/* ---- contact (WhatsApp) ---- */
if (CONFIG.whatsappNumber) {
  const c = $("#contactBtn");
  const msg = encodeURIComponent("How Much Long Maintenance Mode?");
  c.href = "https://wa.me/" + CONFIG.whatsappNumber + "?text=" + msg;
  c.target = "_blank";
  c.rel = "noopener";
  c.textContent = CONFIG.contactLabel;
} else {
  $("#contactBtn").hidden = true;
}

/* ---- retry ---- */
$("#retryBtn").addEventListener("click", () => { location.href = "index.html"; });

/* ============================================================
   APP FEEL — disable copy / long-press / drag / context menu
   ============================================================ */
["contextmenu","selectstart","dragstart","copy","cut"].forEach(evt => {
  document.addEventListener(evt, e => e.preventDefault(), { passive:false });
});

/* block double-tap zoom */
let lastTouch = 0;
document.addEventListener("touchend", (e) => {
  const now = Date.now();
  if (now - lastTouch <= 300) e.preventDefault();
  lastTouch = now;
}, { passive:false });

/* block pinch zoom (iOS/Android) */
document.addEventListener("touchmove", (e) => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive:false });

/* block ctrl +/- and ctrl+scroll */
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && ["+","-","=","0"].includes(e.key)) e.preventDefault();
});
document.addEventListener("wheel", (e) => {
  if (e.ctrlKey) e.preventDefault();
}, { passive:false });

/* ============================================================
   Floating hearts & sparkles
   ============================================================ */
const floaty = $("#floaty");
const glyphs = ["💖","🌸","✨","💕","🎀","💗","⭐","🌷"];
const COUNT = window.innerWidth < 480 ? 14 : 20;

for (let i = 0; i < COUNT; i++) {
  const s = document.createElement("span");
  s.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
  s.style.left = Math.random() * 100 + "vw";
  s.style.fontSize = (13 + Math.random() * 16) + "px";
  s.style.animationDuration = (10 + Math.random() * 10) + "s";
  s.style.animationDelay = (-Math.random() * 20) + "s";
  floaty.appendChild(s);
}

/* ============================================================
   Auto-check — reload once app is back online
   ============================================================ */
const MARKER = "MAINTENANCE" + "_MARKER";
const hintEl = $("#hint");
let secondsLeft = CONFIG.autoCheckSeconds;
let reloading = false;

async function checkIfBack() {
  try {
    const url = "https://firestore.googleapis.com/v1/projects/pika-store-604d2/databases/(default)/documents/config/maintenance";
    const res = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });

    // Doc doesn't exist → maintenance was never turned on → store is open
    if (res.status === 404) {
      reloading = true;
      hintEl.textContent = "Back online — reloading… ♡";
      location.href = "index.html";
      return;
    }
    if (!res.ok) return;

    const data = await res.json();
    const enabled = data?.fields?.enabled?.booleanValue === true;

    if (!enabled) {
      reloading = true;
      hintEl.textContent = "Back online — reloading… ♡";
      location.href = "index.html";
    }
  } catch (e) {
    console.warn("maintenance check failed", e);
  }
}

if (CONFIG.autoCheck) {
  setInterval(() => {
    if (reloading) return;
    secondsLeft--;
    if (secondsLeft <= 0) {
      secondsLeft = CONFIG.autoCheckSeconds;
      checkIfBack();
    }
    hintEl.innerHTML = 'Checking again in <b>' + secondsLeft + '</b>s…';
  }, 1000);
} else {
  hintEl.hidden = true;
}
</script>
</body>
</html>

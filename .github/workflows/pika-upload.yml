name: Pika Upload

on:
  repository_dispatch:
    types: [pika-upload]

jobs:
  upload-to-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Setup Python + boto3
        run: pip install --quiet boto3

      - name: Download from R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_KEY: ${{ github.event.client_payload.key }}
        run: |
          python3 << 'PYEOF'
          import os, boto3
          s3 = boto3.client(
              's3',
              endpoint_url=os.environ['R2_ENDPOINT_URL'],
              aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
              region_name='auto'
          )
          s3.download_file(
              os.environ['R2_BUCKET'],
              os.environ['R2_KEY'],
              '/tmp/pika_file'
          )
          print("Downloaded from R2")
          PYEOF

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.client_payload.releaseTag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "Pika Store assets. Auto-managed."
          fi

      - name: Upload asset to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.client_payload.releaseTag }}
          ASSET_NAME: ${{ github.event.client_payload.assetName }}
        run: |
          gh release upload "$TAG" "/tmp/pika_file#$ASSET_NAME" --clobber

      - name: Delete from R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_KEY: ${{ github.event.client_payload.key }}
        run: |
          python3 << 'PYEOF'
          import os, boto3
          s3 = boto3.client(
              's3',
              endpoint_url=os.environ['R2_ENDPOINT_URL'],
              aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
              region_name='auto'
          )
          s3.delete_object(Bucket=os.environ['R2_BUCKET'], Key=os.environ['R2_KEY'])
          print("Deleted from R2")
          PYEOF

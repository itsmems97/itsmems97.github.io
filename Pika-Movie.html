<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000" id="meta-theme-color">
<meta name="description" content="PIKA MOVIE - Premium Streaming">
<link rel="icon" href="https://raw.githubusercontent.com/itsmems97/itsmems97.github.io/refs/heads/main/Pika-Movie.png">
<title>PIKA MOVIE</title>
<script>try{var t=localStorage.getItem('pika_theme');if(t){document.documentElement.setAttribute('data-theme',t);}}catch(e){}</script>
<style>
:root{
  --accent:#e50914;
  --bg:#050506;
  --glass:rgba(255,255,255,.07);
  --glass-strong:rgba(255,255,255,.13);
  --glass-border:rgba(255,255,255,.12);
  --text:#fff;
  --text-2:#a3a3a8;
  --nav-bg:rgba(24,24,27,.97);
  --sheet-bg:#121214;
  --glow:rgba(229,9,20,.20);
  --hdr-h:58px;
  --nav-h:68px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[data-theme="light"]{
  --bg:#f4f4f6;--glass:rgba(0,0,0,.05);--glass-strong:rgba(0,0,0,.09);--glass-border:rgba(0,0,0,.09);
  --text:#0b0b0c;--text-2:#6a6a70;--nav-bg:rgba(255,255,255,.97);--sheet-bg:#fafafb;--glow:rgba(229,9,20,.08);
}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;padding:0;min-height:100%;overscroll-behavior:none;touch-action:pan-y}
body{position:relative;font-family:var(--font);background:var(--bg);color:var(--text);overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.35}
/* one static glow, no fixed layer = no repaint while scrolling */
body::before{content:"";position:absolute;top:0;left:0;right:0;height:420px;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 80% 100% at 50% 0,var(--glow),transparent 70%)}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;outline:none}
input{font:inherit;color:inherit;outline:none}
img{display:block;max-width:100%}
svg{display:block;flex-shrink:0}
.hidden{display:none!important}
.muted{color:var(--text-2);font-size:13px;margin-bottom:10px}

/* ---------- Splash ---------- */
#splash{position:fixed;inset:0;z-index:9999;background:#000;display:grid;place-items:center;transition:opacity .4s,visibility .4s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-inner{display:flex;flex-direction:column;align-items:center;gap:14px}
.splash-logo{width:min(34vw,128px);height:min(34vw,128px);border-radius:26%;object-fit:cover;animation:pop .5s ease-out both}
.splash-text{font-size:clamp(28px,9vw,46px);font-weight:900;letter-spacing:.14em;color:#fff;animation:fade .5s .15s both}
.splash-text span{color:var(--accent)}
.splash-sub{color:#8d8d92;letter-spacing:.3em;font-size:10px;text-transform:uppercase;animation:fade .5s .4s both}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- New Header ---------- */
.app-header{
  position:fixed;top:0;left:0;right:0;z-index:800;
  height:calc(var(--hdr-h) + var(--safe-top));padding:var(--safe-top) 14px 0;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  color:#fff;background:linear-gradient(to bottom,rgba(0,0,0,.72),rgba(0,0,0,0));
  transition:color .25s;
}
.app-header::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--bg);border-bottom:1px solid var(--glass-border);opacity:0;transition:opacity .25s}
.app-header.solid{color:var(--text)}
.app-header.solid::before{opacity:1}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:36px;height:36px;border-radius:10px;object-fit:cover;background:#222}
.brand-name{font-size:19px;font-weight:900;letter-spacing:.08em;line-height:1;white-space:nowrap}
.brand-name b{color:var(--accent);font-weight:900}
.app-header:not(.solid) .brand-name{text-shadow:0 1px 6px rgba(0,0,0,.55)}
.hdr-actions{display:flex;gap:8px}
.hdr-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:inherit;background:rgba(255,255,255,.16);transition:background .25s,transform .15s}
.hdr-btn:active{transform:scale(.92)}
.app-header.solid .hdr-btn{background:var(--glass-strong)}

/* ---------- Layout ---------- */
#app{min-height:100vh}
main{padding-bottom:calc(var(--nav-h) + var(--safe-bottom) + 28px)}
.screen{display:none;min-height:100vh}
.screen.active{display:block}
.screen-pad{padding:calc(var(--hdr-h) + var(--safe-top) + 14px) 16px 20px;max-width:1400px;margin:0 auto}
.screen-title{font-size:28px;font-weight:800;margin-bottom:14px}

/* ---------- Bottom Nav (no blur = smooth on weak GPUs) ---------- */
.bottom-nav{
  position:fixed;z-index:700;left:50%;transform:translateX(-50%);
  bottom:calc(12px + var(--safe-bottom));width:min(calc(100% - 28px),460px);height:var(--nav-h);
  border-radius:999px;padding:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  background:var(--nav-bg);border:1px solid var(--glass-border);box-shadow:0 8px 24px rgba(0,0,0,.4);
}
.nav-btn{border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text-2);font-size:10.5px;font-weight:700;transition:background .2s,color .2s}
.nav-btn.active{color:var(--text);background:var(--glass-strong)}
.nav-btn.active svg{color:var(--accent)}

/* ---------- Hero ---------- */
.hero{position:relative;height:min(68vh,560px);min-height:380px;overflow:hidden;color:#fff;background:#111;border-radius:0 0 26px 26px}
.hero-imgs{position:absolute;inset:0}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%;opacity:0;transition:opacity .6s}
.hero-img.on{opacity:1}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.92) 0,rgba(0,0,0,.35) 55%,rgba(0,0,0,.3) 100%)}
.hero-content{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:0 18px 40px;display:flex;flex-direction:column;gap:10px;max-width:760px}
.hero-badge{align-self:flex-start;padding:5px 12px;font-size:12px;font-weight:700;border-radius:999px;background:rgba(255,255,255,.16);display:flex;align-items:center;gap:6px}
.hero-badge svg{color:#ff6a3d}
.hero-title{font-size:clamp(28px,8vw,54px);font-weight:900;line-height:1.04;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;font-weight:600;color:rgba(255,255,255,.88);align-items:center}
.hero-meta .rate{color:#f5b301;display:inline-flex;align-items:center;gap:4px}
.hero-desc{font-size:14px;line-height:1.5;color:rgba(255,255,255,.8);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero-actions{display:flex;gap:10px;margin-top:4px}
.hero .btn-glass{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.25);color:#fff}
.hero-dots{position:absolute;z-index:3;right:10px;bottom:10px;display:flex}
.dot{width:20px;height:22px;position:relative}
.dot::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:3px;background:rgba(255,255,255,.45);transition:background .25s}
.dot.on::after{background:var(--accent);width:6px;box-shadow:0 0 0 2px rgba(255,255,255,.35)}

/* ---------- Categories ---------- */
#category-bar{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;scrollbar-width:none;position:sticky;top:calc(var(--hdr-h) + var(--safe-top));z-index:100;background:var(--bg)}
#category-bar::-webkit-scrollbar,.row-scroll::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.cat-tab{flex:0 0 auto;padding:8px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-border);color:var(--text-2);font-size:13px;font-weight:600;white-space:nowrap}
.cat-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- Rows & cards ---------- */
.row{margin-top:18px;content-visibility:auto;contain-intrinsic-size:auto 270px}
.row-head{display:flex;align-items:center;padding:0 16px;margin-bottom:10px}
.row-title{font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px}
.row-title svg{color:var(--accent)}
.row-scroll{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.card{position:relative;width:100%;aspect-ratio:2/3;border-radius:16px;overflow:hidden;cursor:pointer;background:var(--glass);border:1px solid var(--glass-border);contain:layout paint;transition:transform .15s}
.card:active{transform:scale(.97)}
.row-scroll .card{flex:0 0 auto;width:clamp(112px,31vw,150px)}
.poster{width:100%;height:100%;object-fit:cover;background:#1a1a1d}
.card-fade{position:absolute;bottom:0;left:0;right:0;padding:28px 9px 8px;background:linear-gradient(to top,rgba(0,0,0,.92),transparent);color:#fff}
.card-title{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-sub{font-size:10.5px;color:rgba(255,255,255,.65);margin-top:1px}
.badge-rate{position:absolute;top:7px;right:7px;padding:3px 7px;border-radius:999px;font-size:10px;font-weight:800;background:rgba(0,0,0,.65);color:#fff;display:flex;align-items:center;gap:3px}
.badge-rate svg{color:#f5b301}
.badge-type{position:absolute;top:7px;left:7px;padding:3px 7px;border-radius:999px;font-size:9px;font-weight:800;background:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;padding:0 16px}
.search-grid{padding:0}
.skel .card{background:var(--glass);border-color:transparent}

/* ---------- Search ---------- */
.search-bar{display:flex;align-items:center;height:50px;border-radius:999px;padding:0 16px;gap:10px;background:var(--glass);border:1px solid var(--glass-border);margin-bottom:14px}
.search-bar input{flex:1;min-width:0;background:none;border:0;font-size:16px;color:var(--text);-webkit-user-select:text;user-select:text}
.search-clear{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--glass-strong)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;scrollbar-width:none;flex-wrap:wrap}
.chip{padding:8px 15px;border-radius:999px;font-size:13px;font-weight:600;background:var(--glass);border:1px solid var(--glass-border);white-space:nowrap}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;padding:0 20px;min-height:44px;border-radius:999px;font-weight:700;font-size:14px;gap:8px;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn-primary{background:#fff;color:#000}
.btn-glass{background:var(--glass);border:1px solid var(--glass-border);color:var(--text)}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--glass-strong);color:var(--text)}

/* ---------- Detail sheet ---------- */
#sheet-backdrop{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.62);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
#sheet-backdrop.open{opacity:1;visibility:visible}
#sheet{position:fixed;z-index:910;left:50%;bottom:0;width:min(100%,860px);max-height:92vh;transform:translate(-50%,100%);overflow-y:auto;overscroll-behavior:contain;background:var(--sheet-bg);border-radius:26px 26px 0 0;border-top:1px solid var(--glass-border);transition:transform .32s cubic-bezier(.16,1,.3,1);visibility:hidden}
#sheet.open{transform:translate(-50%,0);visibility:visible}
.sheet-hero{height:240px;width:100%;position:relative;background:#111}
.sheet-hero img{width:100%;height:100%;object-fit:cover}
.sheet-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--sheet-bg) 0,transparent 85%)}
.sheet-close{position:absolute;top:14px;right:14px;z-index:2;background:rgba(0,0,0,.55);color:#fff}
.sheet-body{padding:0 20px calc(36px + var(--safe-bottom));position:relative;z-index:2;margin-top:-54px}
.sheet-title{font-size:26px;font-weight:900;margin-bottom:8px;line-height:1.15}
.sheet-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--text-2);margin-bottom:16px;align-items:center}
.sheet-meta .rate{color:#f5b301;display:inline-flex;align-items:center;gap:4px;font-weight:700}
.sheet-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.sheet-desc{font-size:14px;line-height:1.65;opacity:.9}

/* ---------- Player ---------- */
#player{position:fixed;inset:0;z-index:1000;background:#000;display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;color:#fff}
#player.open{opacity:1;visibility:visible}
.player-top{display:flex;align-items:center;gap:12px;padding:calc(10px + var(--safe-top)) 14px 10px;background:#000;z-index:3;position:relative}
.player-title{flex:1;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-frame{flex:1;position:relative;background:#050505}
.player-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player-loading{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;background:#000}
.spinner{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.player-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px calc(10px + var(--safe-bottom));background:#000;z-index:3;position:relative}
.player-bottom .grow{flex:1}
.player-bottom .icon-btn,.player-top .icon-btn{background:rgba(255,255,255,.14);color:#fff}
#lang-drawer{position:absolute;z-index:5;left:0;right:0;bottom:0;max-height:70%;overflow-y:auto;padding:18px;border-radius:22px 22px 0 0;background:#171719;transform:translateY(105%);transition:transform .3s cubic-bezier(.16,1,.3,1);border-top:1px solid rgba(255,255,255,.1);visibility:hidden}
#lang-drawer.open{transform:translateY(0);visibility:visible}
.drawer-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.lang-btn{display:block;padding:12px 16px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:14px;text-align:left;margin-bottom:8px;width:100%}
.lang-btn.active{background:rgba(229,9,20,.18);border-color:var(--accent);color:#fff;font-weight:700}

/* ---------- Misc ---------- */
#toast-wrap{position:fixed;z-index:2000;bottom:calc(var(--nav-h) + var(--safe-bottom) + 30px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{padding:11px 22px;border-radius:999px;background:var(--nav-bg);color:var(--text);font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.45);border:1px solid var(--glass-border);animation:up .25s ease-out}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.empty-state{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:44px 20px;color:var(--text-2);font-size:14px}
.empty-state svg{opacity:.5}
.profile-card{border-radius:22px;padding:20px;background:var(--glass);border:1px solid var(--glass-border);margin-top:6px}
.profile-top{display:flex;align-items:center;gap:16px}
.avatar{width:60px;height:60px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:24px;font-weight:800;color:#fff}
.profile-stats{display:flex;gap:10px;margin-top:18px}
.stat{flex:1;padding:14px;border-radius:16px;background:var(--glass);text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--text-2)}
.profile-actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}

/* ===== FIX: header hamesha solid ===== */
.app-header{color:var(--text)!important;background:var(--bg)!important;border-bottom:1px solid var(--glass-border)}
.app-header::before{display:none!important}
.app-header .hdr-btn{background:var(--glass-strong)!important}
.app-header .brand-name{text-shadow:none!important}
#screen-home{padding-top:calc(var(--hdr-h) + var(--safe-top))}

/* ===== FIX: search ka blue X hatao ===== */
#search-input{-webkit-appearance:none;appearance:none}
#search-input::-webkit-search-cancel-button,
#search-input::-webkit-search-decoration,
#search-input::-webkit-search-results-button,
#search-input::-webkit-search-results-decoration{-webkit-appearance:none;appearance:none;display:none}

/* ===== FIX: sheet aur language drawer band hote waqt slide ===== */
#sheet{transition:transform .32s cubic-bezier(.16,1,.3,1),visibility .32s}
#lang-drawer{transition:transform .3s cubic-bezier(.16,1,.3,1),visibility .3s}

/* ===== Episodes drawer ===== */
#eps-drawer{position:absolute;z-index:5;left:0;right:0;bottom:0;max-height:70%;overflow-y:auto;padding:18px;border-radius:22px 22px 0 0;background:#171719;transform:translateY(105%);transition:transform .3s cubic-bezier(.16,1,.3,1),visibility .3s;border-top:1px solid rgba(255,255,255,.1);visibility:hidden}
#eps-drawer.open{transform:translateY(0);visibility:visible}
.season-btn{display:inline-block;padding:9px 16px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:13px;margin:0 8px 10px 0}
.season-btn.active{background:rgba(229,9,20,.18);border-color:var(--accent);font-weight:700}
.eps-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ep-btn{padding:12px 0;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:14px;text-align:center}
.ep-btn.active{background:var(--accent);border-color:var(--accent);font-weight:800}
.eps-pill{width:auto!important;padding:0 16px;border-radius:999px!important;font-size:13px;font-weight:700;display:flex!important;align-items:center}

/* ===== Android Show Taps Effect (Soft Fade) ===== */
.tap-dot {
  position: fixed; left: 0; top: 0; width: 22px; height: 22px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.48);
  border: 1px solid rgba(255, 255, 255, 0.30);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.10);
  transform: translate(-50%, -50%) scale(0.88);
  opacity: 0; pointer-events: none; z-index: 999999; display: block;
  transition: opacity 150ms ease-out, transform 150ms ease-out;
  will-change: opacity, transform, left, top;
}
.tap-dot.visible {
  opacity: 0.48;
  transform: translate(-50%, -50%) scale(1);
  transition: opacity 110ms ease-in, transform 110ms ease-out;
}
@media (prefers-reduced-motion: reduce) {
  .tap-dot, .tap-dot.visible { transition-duration: 50ms; }
}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="splash">
  <div class="splash-inner">
    <img class="splash-logo" alt="" src="https://raw.githubusercontent.com/itsmems97/itsmems97.github.io/refs/heads/main/Pika-Movie.png">
    <div class="splash-text">PIKA <span>MOVIE</span></div>
    <div class="splash-sub">Unlimited Movies &amp; Shows</div>
  </div>
</div>

<div id="app">
  <header class="app-header" id="app-header">
    <div class="brand">
      <img alt="" src="https://raw.githubusercontent.com/itsmems97/itsmems97.github.io/refs/heads/main/Pika-Movie.png">
      <div class="brand-name">PIKA <b>MOVIE</b></div>
    </div>
    <div class="hdr-actions">
      <button class="hdr-btn" data-act="search-go" aria-label="Search"><span data-icon="search" data-size="20"></span></button>
      <button class="hdr-btn" data-act="theme" aria-label="Toggle theme"><span id="theme-icon" data-icon="moon" data-size="20"></span></button>
    </div>
  </header>

  <main>
    <section id="screen-home" class="screen active">
      <div id="hero-wrap"></div>
      <div id="category-bar"></div>
      <div id="home-rows"></div>
    </section>

    <section id="screen-search" class="screen">
      <div class="screen-pad">
        <h1 class="screen-title">Search</h1>
        <div class="search-bar">
          <span data-icon="search" data-size="20"></span>
          <input id="search-input" type="search" placeholder="Movies, shows, genres..." autocomplete="off" enterkeyhint="search">
          <button class="search-clear hidden" id="search-clear" data-act="search-clear" aria-label="Clear"><span data-icon="close" data-size="14"></span></button>
        </div>
        <div id="search-body"></div>
      </div>
    </section>

    <section id="screen-list" class="screen">
      <div class="screen-pad">
        <h1 class="screen-title">My List</h1>
        <div id="list-body"></div>
      </div>
    </section>

    <section id="screen-profile" class="screen">
      <div class="screen-pad">
        <h1 class="screen-title">Profile</h1>
        <div class="profile-card">
          <div class="profile-top">
            <div class="avatar">P</div>
            <div><h2 style="font-size:20px">Movie Lover</h2><p style="color:var(--text-2);font-size:14px">Guest Account</p></div>
          </div>
          <div class="profile-stats">
            <div class="stat"><b id="stat-list">0</b><span>In My List</span></div>

  </main>

  <nav class="bottom-nav" id="bottom-nav">

    <button class="nav-btn" data-act="nav" data-id="profile"><span data-icon="profile" data-size="22"></span><span>Profile</span></button>

<aside id="sheet"></aside>

<div id="player">
  <div class="player-top">
    <button class="icon-btn" data-act="close-player" aria-label="Back"><span data-icon="back" data-size="20"></span></button>
    <div class="player-title" id="player-title"></div>
  </div>

    <div class="player-loading" id="player-loading"><div class="spinner"></div></div>

    <div class="drawer-header"><h3>Select Language</h3><button class="icon-btn" data-act="lang-close" aria-label="Close"><span data-icon="close" data-size="18"></span></button></div>
    <div id="lang-list"></div>
  </div>

    <div class="drawer-header"><h3>Episodes</h3><button class="icon-btn" data-act="eps-close" aria-label="Close"><span data-icon="close" data-size="18"></span></button></div>
    <div id="eps-list"></div>
  </div>
</div>

<div id="toast-wrap"></div>

<script>
/* ============================================
   CONFIG & STATE
   ============================================ */
const CONFIG = { API_BASE: 'http://193.122.76.131:4000' };
const API = CONFIG.API_BASE;
const CATS = [
  ['all','All'],['new','New Releases'],['bollywood','Bollywood'],['punjabi','Punjabi'],
  ['hollywood','Hollywood'],['western','Western'],['kdrama','K-Drama'],
  ['action','Action'],['comedy','Comedy'],['horror','Horror']
];
const PLACEHOLDER = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450"><rect width="300" height="450" fill="#1a1a1d"/><g fill="none" stroke="#55555c" stroke-width="6" stroke-linecap="round"><rect x="105" y="190" width="90" height="70" rx="8"/><path d="M125 190v70M175 190v70"/></g></svg>');

const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};
function loadList(){ try { return JSON.parse(store.get('pika_list','[]')).map(String); } catch(e){ return []; } }

const state = {
  screen: 'home',
  theme: document.documentElement.getAttribute('data-theme') || 'dark',
  list: loadList(),
  homeSections: [],
  heroItems: [],
  heroIndex: 0,
  cat: 'all',
  catTok: 0,
  catPage: 1,
  catMore: true,
  catLoading: false,
  catSeen: null,
  sheetId: null,
  player: { item: null, dubs: [], dubId: null, loadTimer: 0, season: 1, episode: 1, seasons: [], viewSeason: 1 }
};
const itemCache = new Map();
const scrollPos = {};
const layers = [];
let heroTimer = 0;

/* ============================================
   ICONS
   ============================================ */
const ICONS = {
  'home':'<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h5v-6h4v6h5V10"/>',
  'search':'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  'list':'<path d="M6 3h12v18l-6-4.5L6 21z"/>',
  'profile':'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
  'play':'<path fill="currentColor" stroke="none" d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8A1 1 0 0 0 8 5.2z"/>',
  'plus':'<path d="M12 5v14M5 12h14"/>',
  'check':'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  'close':'<path d="M6 6l12 12M18 6 6 18"/>',
  'back':'<path d="M19 12H5m6-6-6 6 6 6"/>',
  'info':'<circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.6" r="0.7" fill="currentColor"/>',
  'star-filled':'<path fill="currentColor" stroke="currentColor" d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  'fire':'<path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.2 2-4.2 0 2 1 2.7 1.5 2.7C10 8 11 5.5 12 3z"/>',
  'sparkle':'<path d="M12 3c.6 4.2 2.8 6.4 7 7-4.2.6-6.4 2.8-7 7-.6-4.2-2.8-6.4-7-7 4.2-.6 6.4-2.8 7-7z"/>',
  'star':'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  'tv':'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="m8 2 4 4 4-4"/>',
  'film':'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>',
  'zap':'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  'moon':'<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/>',
  'sun':'<circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/>',
  'fullscreen':'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  'globe':'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
  'refresh':'<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>'
};
function icon(name, size){
  size = size || 24;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[name]||ICONS.info)+'</svg>';
}
function hydrateIcons(root){
  (root || document).querySelectorAll('[data-icon]').forEach(function(el){
    if (el.dataset.hydrated) return;
    el.innerHTML = icon(el.dataset.icon, Number(el.dataset.size) || 24);
    el.style.display = 'inline-grid';
    el.style.placeItems = 'center';
    el.dataset.hydrated = '1';
  });
}

/* ============================================
   UTILITIES
   ============================================ */
const $ = function(s){ return document.querySelector(s); };
const $$ = function(s){ return Array.from(document.querySelectorAll(s)); };
const esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };

const apiCache = new Map();
async function apiGet(path, opts){
  opts = opts || {};
  const ttl = opts.ttl == null ? 300000 : opts.ttl;
  const hit = apiCache.get(path);
  if (hit && Date.now() - hit.t < ttl) return hit.data;
  const ctrl = new AbortController();
  const timer = setTimeout(function(){ ctrl.abort(); }, 15000);
  if (opts.signal) opts.signal.addEventListener('abort', function(){ ctrl.abort(); }, { once: true });
  try {
    const res = await fetch(API + path, { signal: ctrl.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    apiCache.set(path, { t: Date.now(), data: data });
    return data;
  } finally { clearTimeout(timer); }
}

function toast(msg){
  const wrap = $('#toast-wrap');
  while (wrap.children.length > 1) wrap.firstChild.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(function(){ el.style.opacity = '0'; setTimeout(function(){ el.remove(); }, 250); }, 1800);
}

function cacheItem(it){
  if (!it || it.id == null) return;
  const id = String(it.id);
  itemCache.set(id, Object.assign({}, itemCache.get(id), it));
}

function skeleton(n){
  let h = '<div class="grid skel">';
  for (let i = 0; i < (n || 9); i++) h += '<div class="card"></div>';
  return h + '</div>';
}
function emptyState(msg, retry){
  return '<div class="empty-state">'+icon('film',56)+'<p>'+esc(msg)+'</p>'+(retry ? '<button class="btn btn-glass" data-act="retry" data-id="'+esc(retry)+'">'+icon('refresh',16)+' Retry</button>' : '')+'</div>';
}
function gridHtml(items, cls){
  return '<div class="grid '+(cls||'')+'">' + items.map(posterCard).join('') + '</div>';
}

/* ============================================
   LAYERS (Android back button closes sheet/player)
   ============================================ */
function pushLayer(name){ layers.push(name); try { history.pushState({ l: name }, ''); } catch(e){} }
function closeTop(name){
  if (layers[layers.length - 1] !== name) return;
  try { history.back(); } catch(e){ popLayer(); }
}
function popLayer(){
  const top = layers.pop();
  if (top === 'player') hidePlayerUI();
  else if (top === 'sheet') hideSheetUI();
}
window.addEventListener('popstate', function(){ if (layers.length) popLayer(); });

/* ============================================
   THEME & HEADER
   ============================================ */
function applyThemeUI(){
  const dark = state.theme === 'dark';
  $('#theme-icon').innerHTML = icon(dark ? 'moon' : 'sun', 20);
  $('#meta-theme-color').setAttribute('content', dark ? '#000000' : '#f4f4f6');
  const st = $('#stat-theme'); if (st) st.textContent = dark ? 'Dark' : 'Light';
}
function toggleTheme(){
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', state.theme);
  store.set('pika_theme', state.theme);
  applyThemeUI();
}

let headerSolid = null;
function updateHeader(){
  const solid = state.screen !== 'home' || window.scrollY > 40;
  if (solid === headerSolid) return;
  headerSolid = solid;
  $('#app-header').classList.toggle('solid', solid);
}
/* ===== Endless Scroll: Category Grid ===== */
function maybeLoadMoreCategory(){
  if (state.screen !== 'home') return;
  if (state.cat === 'all') return;
  if (state.catLoading || !state.catMore) return;
  if (layers.length) return;
  const grid = $('#home-rows').querySelector('.grid');
  if (!grid) return;
  const rect = grid.getBoundingClientRect();
  if (rect.bottom - window.innerHeight < 400) loadMoreCategory();
}

async function loadMoreCategory(){
  if (state.screen !== 'home' || state.cat === 'all') return;
  if (state.catLoading || !state.catMore) return;
  const host = $('#home-rows');
  const grid = host.querySelector('.grid');
  if (!grid) return;

  state.catLoading = true;
  const tok = state.catTok;
  const page = state.catPage + 1;

  let loader = document.getElementById('cat-loader');
  if (!loader){
    loader = document.createElement('div');
    loader.id = 'cat-loader';
    loader.style.cssText = 'text-align:center;padding:16px;color:var(--text-2);font-size:13px;';
    loader.textContent = 'Loading more...';
    host.appendChild(loader);
  }

  try {
    const res = await fetchCategory(state.cat, page);
    if (tok !== state.catTok) return;

    const fresh = res.items.filter(function(it){ return it && it.id != null && !state.catSeen.has(String(it.id)); });

    if (!fresh.length){
      state.catMore = false;
    } else {
      fresh.forEach(function(it){ state.catSeen.add(String(it.id)); });
      state.catPage = page;
      grid.insertAdjacentHTML('beforeend', fresh.map(posterCard).join(''));
      state.catMore = res.more;
    }

    const sentinel = document.getElementById('cat-sentinel');
    if (sentinel) sentinel.textContent = state.catMore ? '' : 'No more movies.';
  } catch(e){
    if (tok === state.catTok){
      const sentinel = document.getElementById('cat-sentinel');
      if (sentinel) sentinel.textContent = 'Load failed. Scroll again to retry.';
    }
  } finally {
    if (tok === state.catTok){
      state.catLoading = false;
      const l = document.getElementById('cat-loader');
      if (l) l.remove();
    }
  }

  setTimeout(maybeLoadMoreCategory, 150);
}

let catScrollTicking = false;
window.addEventListener('scroll', function(){
  if (catScrollTicking) return;
  catScrollTicking = true;
  requestAnimationFrame(function(){ catScrollTicking = false; maybeLoadMoreCategory(); });
}, { passive: true });

/* ============================================
   NAVIGATION
   ============================================ */
function navigate(name){
  scrollPos[state.screen] = window.scrollY;
  state.screen = name;
  $$('.screen').forEach(function(s){ s.classList.toggle('active', s.id === 'screen-' + name); });
  $$('.nav-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.id === name); });
  if (name === 'home') loadHome();
  if (name === 'list') renderListScreen();
  if (name === 'profile') renderProfile();
  if (name === 'search' && !$('#search-input').value.trim() && !$('#search-body').innerHTML) renderBrowse();
  window.scrollTo(0, scrollPos[name] || 0);
  headerSolid = null; updateHeader();
}

/* ============================================
   HOME & HERO
   ============================================ */
function posterCard(it){
  cacheItem(it);
  const id = esc(it.id);
  return '<article class="card" data-act="open" data-id="'+id+'">'+
    '<img class="poster" src="'+esc(it.poster || PLACEHOLDER)+'" alt="" loading="lazy" decoding="async">'+
    (Number(it.rating) > 0 ? '<span class="badge-rate">'+icon('star-filled',10)+' '+esc(it.rating)+'</span>' : '')+
    (it.type === 'tv' ? '<span class="badge-type">TV</span>' : '')+
    '<div class="card-fade"><div class="card-title">'+esc(it.title)+'</div><div class="card-sub">'+esc(it.year || '')+'</div></div></article>';
}

function renderHero(){
  const wrap = $('#hero-wrap');
  const items = state.heroItems;
  if (!items.length){ wrap.innerHTML = ''; return; }
  wrap.innerHTML = '<section class="hero" id="hero"><div class="hero-imgs">'+
    items.map(function(it, i){
      return '<img class="hero-img'+(i ? '' : ' on')+'" alt="" decoding="async" '+(i ? 'data-src' : 'src')+'="'+esc(it.backdrop || it.poster || PLACEHOLDER)+'">';
    }).join('')+'</div><div class="hero-content" id="hero-info"></div>'+
    (items.length > 1 ? '<div class="hero-dots">'+items.map(function(_, i){ return '<button class="dot" data-act="dot" data-id="'+i+'" aria-label="Slide '+(i+1)+'"></button>'; }).join('')+'</div>' : '')+
    '</section>';
  setHero(0);
  startHeroTimer();
}

function setHero(i){
  const it = state.heroItems[i];
  if (!it) return;
  state.heroIndex = i;
  $$('#hero .hero-img').forEach(function(img, k){
    if (k === i && img.dataset.src){ img.src = img.dataset.src; delete img.dataset.src; }
    img.classList.toggle('on', k === i);
  });
  $$('#hero .dot').forEach(function(d, k){ d.classList.toggle('on', k === i); });
  const id = esc(it.id);
  $('#hero-info').innerHTML =
    '<span class="hero-badge">'+icon('fire',14)+' Trending Now</span>'+
    '<h1 class="hero-title">'+esc(it.title)+'</h1>'+
    '<div class="hero-meta">'+(it.year ? '<span>'+esc(it.year)+'</span><span>•</span>' : '')+'<span>'+(it.type === 'tv' ? 'TV Show' : 'Movie')+'</span>'+
      (Number(it.rating) > 0 ? '<span>•</span><span class="rate">'+icon('star-filled',12)+' '+esc(it.rating)+'</span>' : '')+'</div>'+
    (it.description ? '<p class="hero-desc">'+esc(it.description)+'</p>' : '')+
    '<div class="hero-actions"><button class="btn btn-primary" data-act="play" data-id="'+id+'">'+icon('play',18)+' Play</button>'+
    '<button class="btn btn-glass" data-act="open" data-id="'+id+'">'+icon('info',18)+' Info</button></div>';
}

function startHeroTimer(){
  clearInterval(heroTimer);
  if (state.heroItems.length < 2) return;
  heroTimer = setInterval(function(){
    if (document.hidden || state.screen !== 'home' || layers.length || window.scrollY > 300) return;
    setHero((state.heroIndex + 1) % state.heroItems.length);
  }, 6500);
}

(function(){
  let tx = 0;
  const hw = $('#hero-wrap');
  hw.addEventListener('touchstart', function(e){ tx = e.touches[0].clientX; }, { passive: true });
  hw.addEventListener('touchend', function(e){
    const dx = e.changedTouches[0].clientX - tx, n = state.heroItems.length;
    if (Math.abs(dx) > 50 && n > 1){ setHero((state.heroIndex + (dx < 0 ? 1 : n - 1)) % n); startHeroTimer(); }
  }, { passive: true });
})();

function renderRows(){
  const host = $('#home-rows');
  const icons = ['fire','sparkle','star','tv','film','zap'];
  let html = '', idx = 0;
  state.homeSections.forEach(function(sec){
    if (!sec.items || !sec.items.length) return;
    html += '<section class="row"><div class="row-head"><h2 class="row-title">'+icon(icons[idx++ % icons.length],20)+' '+esc(sec.title)+'</h2></div><div class="row-scroll">'+sec.items.map(posterCard).join('')+'</div></section>';
  });
  host.innerHTML = html || emptyState('Nothing to show yet.', 'home');
}

function buildCategoryBar(){
  $('#category-bar').innerHTML = CATS.map(function(c){
    return '<button class="cat-tab'+(c[0] === 'all' ? ' active' : '')+'" data-act="cat" data-id="'+c[0]+'">'+c[1]+'</button>';
  }).join('');
}

async function loadHome(force){
  if (state.homeSections.length && !force) return;
  const host = $('#home-rows');
  host.innerHTML = skeleton(9);
  try {
    const data = await apiGet('/home', { ttl: force ? 0 : 300000 });
    if (!data.sections || !data.sections.length) throw new Error('empty');
    state.homeSections = data.sections;
    data.sections.forEach(function(s){ (s.items || []).forEach(cacheItem); });
    const first = data.sections.find(function(s){ return s.items && s.items.length; });
    state.heroItems = first ? first.items.slice(0, 5) : [];
    renderHero();
    if (state.cat === 'all') renderRows();
  } catch(e){
    host.innerHTML = emptyState('Could not load movies. Check your connection.', 'home');
    toast('Failed to load home');
  }
}

function pickItems(d){
  if (!d) return [];
  if (Array.isArray(d)) return d;
  var arr = d.items || d.results || d.data;
  if (Array.isArray(arr)) return arr;
  if (Array.isArray(d.sections)){
    var out = [];
    d.sections.forEach(function(s){ (s.items || []).forEach(function(i){ out.push(i); }); });
    return out;
  }
  return [];
}
async function fetchCategory(cat, page){
  page = page || 1;
  var label = (CATS.find(function(c){ return c[0] === cat; }) || [])[1] || cat;
  var d = await apiGet('/category?genre=' + encodeURIComponent(cat) + '&page=' + page, { ttl: page === 1 ? 300000 : 60000 });
  var items = pickItems(d);
  var more = items.length > 0;
  if (d && typeof d === 'object' && !Array.isArray(d)){
    if (d.hasMore === false || d.has_more === false) more = false;
    if (d.nextPage === null || d.next_page === null) more = false;
    if (typeof d.totalPages === 'number' && page >= d.totalPages) more = false;
    if (typeof d.total_pages === 'number' && page >= d.total_pages) more = false;
  }
  if (!items.length){
    if (page === 1){
      try {
        var s = await apiGet('/search?q=' + encodeURIComponent(label), { ttl: 120000 });
        items = pickItems(s);
      } catch(e){}
    }
    more = false;
  }
  return { items: items, more: more };
}
async function selectCat(cat){
  state.cat = cat;
  state.catPage = 1;
  state.catMore = true;
  state.catLoading = false;
  state.catSeen = new Set();
  $$('.cat-tab').forEach(function(t){ t.classList.toggle('active', t.dataset.id === cat); });
  const bar = $('#category-bar');
  const tab = bar.querySelector('.cat-tab.active');
  if (tab) bar.scrollTo({ left: tab.offsetLeft - bar.clientWidth / 2 + tab.clientWidth / 2 });
  const hdr = $('#app-header').offsetHeight;
  const top = bar.offsetTop - hdr;
  if (window.scrollY > top) window.scrollTo(0, Math.max(0, top));
  const host = $('#home-rows');
  if (cat === 'all'){ state.homeSections.length ? renderRows() : loadHome(); return; }
  const tok = ++state.catTok;
  host.innerHTML = skeleton(9);
  try {
    const res = await fetchCategory(cat, 1);
    if (tok !== state.catTok) return;
    const label = (CATS.find(function(c){ return c[0] === cat; }) || [])[1] || cat;
    if (res.items.length){
      res.items.forEach(function(it){ if (it && it.id != null) state.catSeen.add(String(it.id)); });
      state.catMore = res.more;
      host.innerHTML = '<div class="row-head" style="margin-top:6px"><h2 class="row-title">'+esc(label)+'</h2></div>' +
        gridHtml(res.items) +
        '<div id="cat-sentinel" style="text-align:center;padding:16px;color:var(--text-2);font-size:13px;">' + (res.more ? '' : 'No more movies.') + '</div>';
      setTimeout(maybeLoadMoreCategory, 300);
    } else {
      state.catMore = false;
      host.innerHTML = emptyState('No results found.');
    }
  } catch(e){
    if (tok !== state.catTok) return;
    host.innerHTML = emptyState('Error loading category.', 'cat:' + cat);
  }
}

/* ============================================
   SEARCH
   ============================================ */
let sAbort = null, sTimer = 0;
function chipsHtml(active){
  return '<div class="chips">'+CATS.filter(function(c){ return c[0] !== 'all'; }).map(function(c){
    return '<button class="chip'+(c[0] === active ? ' active' : '')+'" data-act="browse" data-id="'+c[0]+'">'+c[1]+'</button>';
  }).join('')+'</div>';
}
function renderBrowse(){
  $('#search-body').innerHTML = '<p class="muted">Browse by category</p>' + chipsHtml('');
}
let browseTok = 0;
async function browse(cat){
  const tok = ++browseTok;
  const body = $('#search-body');
  body.innerHTML = chipsHtml(cat) + '<div id="browse-res">'+skeleton(9)+'</div>';
  try {
    const res = await fetchCategory(cat, 1);
    if (tok !== browseTok) return;
    const host = $('#browse-res'); if (!host) return;
    host.innerHTML = res.items.length ? gridHtml(res.items, 'search-grid') : emptyState('No results found.');
  } catch(e){
    if (tok !== browseTok) return;
    const host = $('#browse-res'); if (host) host.innerHTML = emptyState('Error loading category.');
  }
}
async function runSearch(q){
  if (sAbort) sAbort.abort();
  const ctl = sAbort = new AbortController();
  const body = $('#search-body');
  body.innerHTML = skeleton(6).replace('class="grid skel"', 'class="grid skel search-grid"');
  try {
    const d = await apiGet('/search?q=' + encodeURIComponent(q), { signal: ctl.signal, ttl: 120000 });
    if (ctl !== sAbort) return;
    const items = d.items || [];
    body.innerHTML = items.length ? '<p class="muted">'+items.length+' results</p>' + gridHtml(items, 'search-grid') : emptyState('No results found.');
  } catch(e){
    if (ctl !== sAbort) return;
    body.innerHTML = emptyState('Search failed. Try again.');
  }
}
$('#search-input').addEventListener('input', function(e){
  clearTimeout(sTimer);
  const q = e.target.value.trim();
  $('#search-clear').classList.toggle('hidden', !q);
  if (!q){ if (sAbort) sAbort.abort(); renderBrowse(); return; }
  if (q.length < 2) return;
  sTimer = setTimeout(function(){ runSearch(q); }, 450);
});
$('#search-input').addEventListener('keydown', function(e){
  if (e.key === 'Enter'){ e.target.blur(); const q = e.target.value.trim(); if (q.length > 1){ clearTimeout(sTimer); runSearch(q); } }
});

/* ============================================
   MY LIST & PROFILE
   ============================================ */
function listBtnHtml(id){
  return (state.list.indexOf(id) > -1 ? icon('check',18) : icon('plus',18)) + '<span>My List</span>';
}
function toggleList(id){
  id = String(id);
  const i = state.list.indexOf(id);
  if (i > -1){ state.list.splice(i, 1); toast('Removed from My List'); }
  else { state.list.push(id); toast('Added to My List'); }
  store.set('pika_list', JSON.stringify(state.list));
  $$('[data-act="list"][data-id="'+id+'"]').forEach(function(b){ b.innerHTML = listBtnHtml(id); });
  if (state.screen === 'list') renderListScreen();
}
async function renderListScreen(){
  const host = $('#list-body');
  const ids = state.list.slice();
  if (!ids.length){ host.innerHTML = emptyState('Your list is empty. Start adding movies!'); return; }
  const missing = ids.filter(function(id){ return !itemCache.has(id); });
  if (missing.length){
    host.innerHTML = skeleton(Math.min(ids.length, 9));
    await Promise.all(missing.map(function(id){
      return apiGet('/detail?id=' + encodeURIComponent(id)).then(function(d){ if (d.item) cacheItem(d.item); }).catch(function(){});
    }));
  }
  if (state.screen !== 'list') return;
  const items = ids.map(function(id){ return itemCache.get(id); }).filter(Boolean);
  host.innerHTML = items.length ? gridHtml(items, 'search-grid') : emptyState('Error loading list.', 'list');
}
function renderProfile(){
  $('#stat-list').textContent = state.list.length;
  applyThemeUI();
}

/* ============================================
   DETAIL SHEET
   ============================================ */
function renderSheet(item){
  const id = esc(item.id);
  const genres = Array.isArray(item.genres) ? item.genres.join(' • ') : (item.genre || '');
  return '<div class="sheet-hero"><img src="'+esc(item.backdrop || item.poster || PLACEHOLDER)+'" alt="">'+
    '<button class="icon-btn sheet-close" data-act="close-sheet" aria-label="Close">'+icon('close',20)+'</button></div>'+
    '<div class="sheet-body"><h2 class="sheet-title">'+esc(item.title)+'</h2>'+
    '<div class="sheet-meta">'+(item.year ? '<span>'+esc(item.year)+'</span><span>•</span>' : '')+'<span>'+(item.type === 'tv' ? 'TV Show' : 'Movie')+'</span>'+
      (Number(item.rating) > 0 ? '<span>•</span><span class="rate">'+icon('star-filled',14)+' '+esc(item.rating)+'</span>' : '')+
      (genres ? '<span>•</span><span>'+esc(genres)+'</span>' : '')+'</div>'+
    '<div class="sheet-actions"><button class="btn btn-primary" data-act="play" data-id="'+id+'">'+icon('play',18)+' Play Now</button>'+
    '<button class="btn btn-glass" data-act="list" data-id="'+id+'">'+listBtnHtml(String(item.id))+'</button></div>'+
    '<p class="sheet-desc">'+esc(item.description || 'No description available.')+'</p></div>';
}
async function openDetail(id){
  id = String(id);
  const sheet = $('#sheet');
  const cached = itemCache.get(id);
  state.sheetId = id;
  sheet.scrollTop = 0;
  sheet.innerHTML = cached ? renderSheet(cached) : '<div style="padding:50px;display:grid;place-items:center"><div class="spinner"></div></div>';
  if (layers.indexOf('sheet') < 0){
    sheet.classList.add('open');
    $('#sheet-backdrop').classList.add('open');
    pushLayer('sheet');
  }
  try {
    const d = await apiGet('/detail?id=' + encodeURIComponent(id));
    if (!d.item) throw new Error('none');
    cacheItem(d.item);
    if (state.sheetId === id) sheet.innerHTML = renderSheet(itemCache.get(id));
  } catch(e){
    if (!cached && state.sheetId === id) sheet.innerHTML = emptyState('Failed to load details.');
  }
}
function hideSheetUI(){
  state.sheetId = null;
  $('#sheet').classList.remove('open');
  $('#sheet-backdrop').classList.remove('open');
}

/* ============================================
   PLAYER
   ============================================ */
function embedUrl(dubId){
  const it = state.player.item;
  const p = state.player;
  return API + '/proxy/embed?id=' + encodeURIComponent(it.id) + '&type=' + encodeURIComponent(it.type || 'movie') + (dubId ? '&dubId=' + encodeURIComponent(dubId) : '') + (it.type === 'tv' ? '&season=' + p.season + '&episode=' + p.episode : '');
}
function loadFrame(url){
  const p = state.player, frame = $('#player-frame'), loader = $('#player-loading');
  loader.classList.remove('hidden');
  frame.querySelectorAll('iframe').forEach(function(f){ f.remove(); });
  const f = document.createElement('iframe');
  f.setAttribute('allow', 'autoplay; fullscreen; encrypted-media; picture-in-picture');
  f.allowFullscreen = true;
  f.onload = function(){ loader.classList.add('hidden'); };
  frame.appendChild(f);
  f.src = url;
  clearTimeout(p.loadTimer);
  p.loadTimer = setTimeout(function(){ loader.classList.add('hidden'); }, 10000);
}
async function openPlayer(item){
  if (!item) return;
  const p = state.player;
  p.item = item; p.dubs = []; p.dubId = null;
  p.season = 1; p.episode = 1; p.seasons = []; p.viewSeason = 1;
  $('#player-title').textContent = item.title || '';
  $('#player-lang').classList.add('hidden');
  $('#player-eps').classList.add('hidden');
  $('#eps-drawer').classList.remove('open');
  $('#lang-drawer').classList.remove('open');
  $('#player').classList.add('open');
  if (layers.indexOf('player') < 0) pushLayer('player');
  loadFrame(embedUrl());
  try {
    const d = await apiGet('/detail?id=' + encodeURIComponent(item.id));
    if (p.item !== item) return;
    if (d.item && d.item.dubs && d.item.dubs.length > 1){
      p.dubs = d.item.dubs;
      p.dubId = item.id;
      $('#player-lang').classList.remove('hidden');
    }
  } catch(e){}
  if (item.type === 'tv'){
    try {
      const e = await apiGet('/episodes?id=' + encodeURIComponent(item.id), { ttl: 300000 });
      if (p.item !== item) return;
      if (e.seasons && e.seasons.length){
        p.seasons = e.seasons;
        $('#player-eps').classList.remove('hidden');
      }
    } catch(err){}
  }
}
function hidePlayerUI(){
  clearTimeout(state.player.loadTimer);
  $('#player').classList.remove('open');
  $('#lang-drawer').classList.remove('open');
  $('#player-frame').querySelectorAll('iframe').forEach(function(f){ f.remove(); });
  state.player.item = null;
  const fs = document.fullscreenElement || document.webkitFullscreenElement;
  if (fs){ try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch(e){} }
}
function toggleFullscreen(){
  const fs = document.fullscreenElement || document.webkitFullscreenElement;
  if (fs){ try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch(e){} return; }
  const el = $('#player');
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req) return;
  try {
    const r = req.call(el);
    if (r && r.then) r.then(function(){ try { screen.orientation.lock('landscape').catch(function(){}); } catch(e){} }).catch(function(){});
  } catch(e){}
}
function openEpsDrawer(){
  const p = state.player;
  const vs = p.viewSeason || p.season;
  const sBtns = p.seasons.map(function(s){
    return '<button class="season-btn'+(s.season === vs ? ' active' : '')+'" data-act="season-pick" data-id="'+s.season+'">Season '+s.season+'</button>';
  }).join('');
  const cur = p.seasons.find(function(s){ return s.season === vs; }) || p.seasons[0];
  let eps = '';
  const n = cur ? cur.count : 0;
  for (let i = 1; i <= n; i++){
    eps += '<button class="ep-btn'+((vs === p.season && i === p.episode) ? ' active' : '')+'" data-act="ep-pick" data-id="'+i+'">'+i+'</button>';
  }
  $('#eps-list').innerHTML = '<div>'+sBtns+'</div><div class="eps-grid">'+eps+'</div>';
  $('#eps-drawer').classList.add('open');
}
function openLangDrawer(){
  const p = state.player;
  $('#lang-list').innerHTML = p.dubs.map(function(d){
    return '<button class="lang-btn'+(String(d.subject_id) === String(p.dubId) ? ' active' : '')+'" data-act="lang-pick" data-id="'+esc(d.subject_id)+'">'+esc(d.lang_name)+'</button>';
  }).join('');
  $('#lang-drawer').classList.add('open');
}

/* ============================================
   EVENTS (one delegated handler = less memory)
   ============================================ */
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act){
    case 'open': openDetail(id); break;
    case 'play': openPlayer(itemCache.get(String(id))); break;
    case 'list': toggleList(id); break;
    case 'cat': selectCat(id); break;
    case 'nav': navigate(id); break;
    case 'dot': setHero(Number(id)); startHeroTimer(); break;
    case 'theme': toggleTheme(); break;
    case 'search-go': navigate('search'); setTimeout(function(){ $('#search-input').focus(); }, 60); break;
    case 'search-clear':
      $('#search-input').value = ''; $('#search-clear').classList.add('hidden');
      if (sAbort) sAbort.abort(); renderBrowse(); break;
    case 'browse': browse(id); break;
    case 'close-sheet': closeTop('sheet'); break;
    case 'close-player': closeTop('player'); break;
    case 'fullscreen': toggleFullscreen(); break;
    case 'reload': if (state.player.item) loadFrame(embedUrl(state.player.dubId)); break;
    case 'eps-open': state.player.viewSeason = state.player.season; openEpsDrawer(); break;
    case 'eps-close': $('#eps-drawer').classList.remove('open'); break;
    case 'season-pick': state.player.viewSeason = Number(id); openEpsDrawer(); break;
    case 'ep-pick':
      state.player.season = state.player.viewSeason || state.player.season;
      state.player.episode = Number(id);
      $('#eps-drawer').classList.remove('open');
      if (state.player.item) $('#player-title').textContent = (state.player.item.title || '') + ' - S' + state.player.season + ' E' + state.player.episode;
      loadFrame(embedUrl(state.player.dubId)); break;
    case 'lang-open': openLangDrawer(); break;
    case 'lang-close': $('#lang-drawer').classList.remove('open'); break;
    case 'lang-pick':
      state.player.dubId = id;
      $('#lang-drawer').classList.remove('open');
      loadFrame(embedUrl(id)); break;
    case 'clear-list':
      if (!state.list.length){ toast('Your list is already empty'); break; }
      state.list = []; store.set('pika_list', '[]'); renderProfile(); toast('My List cleared'); break;
    case 'retry':
  if (id === 'home') loadHome(true);
  else if (id === 'list') renderListScreen();
  else if (id && id.indexOf('cat:') === 0){
    var g = id.slice(4);
    var prefix = '/category?genre=' + encodeURIComponent(g);
    Array.from(apiCache.keys()).forEach(function(k){ if (k.indexOf(prefix) === 0) apiCache.delete(k); });
    selectCat(g);
  }
  break;
  }
});

document.addEventListener('error', function(e){
  const t = e.target;
  if (t && t.tagName === 'IMG' && !t.dataset.fb){ t.dataset.fb = '1'; t.src = PLACEHOLDER; }
}, true);

/* ============================================
   INIT
   ============================================ */
function hideSplash(){
  const s = $('#splash');
  if (!s || s.classList.contains('hide')) return;
  s.classList.add('hide');
  setTimeout(function(){ s.remove(); }, 500);
}
/* ===== Android Show Taps Effect ===== */
(function() {
  // Create the dot element
  var dot = document.createElement('div');
  dot.className = 'tap-dot';
  dot.setAttribute('aria-hidden', 'true');
  document.body.appendChild(dot);

  var active = new Set();
  var hideTimer;

  function moveDot(x, y) {
    dot.style.left = x + 'px';
    dot.style.top = y + 'px';
    dot.classList.add('visible');
  }

  function start(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    clearTimeout(hideTimer);
    active.add(e.pointerId);
    moveDot(e.clientX, e.clientY);
  }

  function move(e) {
    if (active.has(e.pointerId)) moveDot(e.clientX, e.clientY);
  }

  function end(e) {
    active.delete(e.pointerId);
    if (active.size === 0) {
      // Keep the dot visible briefly, then fade it out.
      hideTimer = setTimeout(function() {
        dot.classList.remove('visible');
      }, 70);
    }
  }

  document.addEventListener('pointerdown', start, {passive: true});
  document.addEventListener('pointermove', move, {passive: true});
  document.addEventListener('pointerup', end, {passive: true});
  document.addEventListener('pointercancel', end, {passive: true});
})();
buildCategoryBar();
hydrateIcons();
applyThemeUI();
updateHeader();
const t0 = Date.now();
loadHome().then(function(){}, function(){}).then(function(){
  setTimeout(hideSplash, Math.max(0, 900 - (Date.now() - t0)));
});
setTimeout(hideSplash, 4500);

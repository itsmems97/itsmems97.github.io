<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Pika Movie</title>
<style>
:root{--red:#e50914;--bg:#000;--mut:#a8a8a8;--card:#1a1a1a;--sa:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:#fff;font-family:Roboto,system-ui,sans-serif;overflow-x:hidden;padding-bottom:calc(66px + var(--sb));user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#splash{position:fixed;inset:0;background:#000;z-index:99;display:grid;place-items:center;transition:opacity .5s}
#splash b{font:900 15vw/1 Impact,'Arial Black',sans-serif;color:var(--red);letter-spacing:.04em;animation:z 1.4s ease-out}
#splash.off{opacity:0;pointer-events:none}
@keyframes z{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
header{position:fixed;top:0;left:0;right:0;z-index:10;padding:calc(10px + var(--sa)) 14px 8px;background:linear-gradient(#000e,#0000);transition:background .3s}
header.s{background:#000}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font:900 26px Impact,'Arial Black',sans-serif;color:var(--red);letter-spacing:.03em}
.chips{display:flex;gap:8px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
.chip{border:1px solid #fff8;border-radius:20px;padding:5px 14px;font-size:14px;white-space:nowrap}
.chip.on{background:#fff;color:#000;border-color:#fff}
.hero{height:68vh;min-height:420px;position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 16px 18px;background-size:cover;background-position:center top}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(#0006,#0000 30%,#000 96%)}
.hero>*{position:relative;z-index:1}
.hero h1{font:900 34px/1.05 Impact,'Arial Black',sans-serif;text-align:center;letter-spacing:.02em;text-shadow:0 2px 12px #000}
.hero p{font-size:13px;color:#ddd;margin:8px 0 14px}
.acts{display:flex;gap:10px;width:100%;max-width:420px}
.btn{flex:1;display:flex;gap:6px;align-items:center;justify-content:center;padding:11px;border-radius:5px;font-weight:700;font-size:16px}
.btn.w{background:#fff;color:#000}.btn.g{background:#6d6d6eb3}
h2{font-size:17px;margin:20px 14px 10px}
.row{display:flex;gap:8px;overflow-x:auto;padding:0 14px;scrollbar-width:none;scroll-snap-type:x proximity}
.card{flex:0 0 112px;aspect-ratio:2/3;border-radius:4px;position:relative;overflow:hidden;scroll-snap-align:start;background-size:cover}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card span{position:absolute;left:6px;right:6px;bottom:8px;font:700 13px/1.1 Roboto,sans-serif;text-shadow:0 1px 4px #000}
.card i{position:absolute;left:0;bottom:0;height:3px;background:var(--red)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px}
.grid .card{flex:none}
.pad{padding-top:calc(70px + var(--sa))}
.sb{display:flex;gap:8px;align-items:center;background:#333;margin:0 14px 14px;border-radius:6px;padding:0 12px}
.sb input{flex:1;background:none;border:0;outline:0;color:#fff;font-size:16px;padding:12px 0;user-select:text}
.empty{color:var(--mut);text-align:center;padding:60px 30px;line-height:1.5}
nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#0c0c0c;border-top:1px solid #222;display:flex;padding-bottom:var(--sb)}
nav button{flex:1;padding:9px 0 7px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:#fff}
nav svg,.ic{width:24px;height:24px;fill:currentColor}
#sh{position:fixed;inset:0;z-index:20;background:#000a;display:none}
#sh.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;top:6vh;background:#141414;border-radius:14px 14px 0 0;overflow-y:auto;animation:up .28s ease-out}
@keyframes up{from{transform:translateY(100%)}}
.bd{height:230px;background-size:cover;background-position:center;position:relative}
.bd:after{content:"";position:absolute;inset:0;background:linear-gradient(#0000 50%,#141414)}
.x{position:absolute;top:10px;right:10px;z-index:2;width:34px;height:34px;border-radius:50%;background:#000b;font-size:20px}
.inf{padding:0 16px 30px}
.inf h1{font-size:24px;margin-top:-10px;position:relative;z-index:1}
.meta{display:flex;gap:10px;align-items:center;color:var(--mut);font-size:13px;margin:8px 0 14px}
.meta b{border:1px solid #666;padding:0 5px;border-radius:3px;font-size:11px;color:#ddd}
.meta em{color:#46d369;font-style:normal;font-weight:700}
.inf .btn{margin-bottom:10px;flex:none;width:100%}
.inf p{font-size:14px;line-height:1.45;color:#ddd;margin:12px 0}
#pl{position:fixed;inset:0;z-index:50;background:#000;display:none;flex-direction:column}
#pl.on{display:flex}
#pl .pbar{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--sa)) 14px 10px;background:#000;border-bottom:1px solid #222}
#pl .pbar button{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:#1a1a1a}
#pl .pbar span{flex:1;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pl .pframe{flex:1;position:relative;background:#000}
#pl iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#toast{position:fixed;left:50%;bottom:calc(84px + var(--sb));transform:translateX(-50%);background:#fff;color:#000;padding:9px 16px;border-radius:20px;font-size:14px;font-weight:700;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
</style></head><body>
<div id="splash"><b>PIKA MOVIE</b></div>
<header id="hd"><div class="top"><span class="logo">PIKA MOVIE</span></div><div class="chips" id="chips"></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="sh"><div class="sheet" id="shc"></div></div>
<div id="pl">
  <div class="pbar">
    <button onclick="stop()" aria-label="Back"><svg class="ic" viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></button>
    <span id="pt"></span>
  </div>
  <div class="pframe" id="pf"></div>
</div>
<div id="toast"></div>
<script>
/* ===== Pika Movie — TMDB Powered ===== */
const API = "https://144-24-218-100.nip.io/movies-api";
const $ = s => document.querySelector(s);
const ld = (k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv = (k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let LIST = ld("pm_list",[]);
let PROG = ld("pm_prog",{});
let tab="home", q="", cur=null, heroI=0, C=[];
const ICO = {home:"M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z",search:"M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z",list:"M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z",me:"M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-3 0-8 1.5-8 4v2h16v-2c0-2.5-5-4-8-4z"};
const NAV = [["home","Home"],["search","Search"],["list","My List"],["me","Profile"]];

function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove("on"),1800)}
const inList = id => LIST.indexOf(id) !== -1;
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]);

async function apiGet(path){
  const r = await fetch(API + path);
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

function nav(){$("#nav").innerHTML = NAV.map(([k,l])=>`<button class="${tab==k?"on":""}" onclick="go('${k}')"><svg viewBox="0 0 24 24"><path d="${ICO[k]}"/></svg>${l}</button>`).join("")}
function go(t){tab=t;scrollTo(0,0);render()}
function chips(){$("#chips").style.display="none"}

function card(m){
  const title = esc(m.title);
  const img = m.poster ? `<img loading="lazy" src="${esc(m.poster)}" alt="" onerror="this.remove()">` : "";
  const prog = PROG[m.id] ? `<i style="width:${Math.min(100, PROG[m.id].t/PROG[m.id].d*100)}%"></i>` : "";
  return `<div class="card" data-id="${esc(m.id)}" data-type="${esc(m.mediaType||'movie')}" onclick="openD('${esc(m.id)}','${esc(m.mediaType||'movie')}')">${img}<span>${title}</span>${prog}</div>`;
}
function row(t, arr){ return arr.length ? `<h2>${t}</h2><div class="row">${arr.map(card).join("")}</div>` : ""; }

function render(){
  nav(); chips();
  const a = $("#app");
  if(tab=="home") a.innerHTML = homeV();
  else if(tab=="search") a.innerHTML = searchV();
  else if(tab=="list"){
    const l = C.filter(m => inList(m.id));
    a.innerHTML = `<div class="pad"><h2 style="margin-top:0">My List</h2>${l.length?`<div class="grid">${l.map(card).join("")}</div>`:`<div class="empty">Your list is empty.<br>Tap "My List" on any title to save it here.</div>`}</div>`;
  } else {
    a.innerHTML = `<div class="pad"><h2 style="margin-top:0">Profile</h2><div class="empty" style="padding:20px 30px">Saved titles: ${LIST.length}<br>Titles in progress: ${Object.keys(PROG).length}</div><div style="padding:0 14px;display:grid;gap:10px"><button class="btn g" onclick="PROG={};sv('pm_prog',PROG);toast('History cleared');render()">Clear watch history</button><button class="btn g" onclick="LIST=[];sv('pm_list',LIST);toast('My List cleared');render()">Clear My List</button></div><div class="empty">Pika Movie v2.0 — TMDB</div></div>`;
  }
}
function homeV(){
  if(!C.length) return `<div class="pad"><div class="empty">Loading movies…</div></div>`;
  const h = C[heroI % C.length];
  if(!h) return `<div class="pad"><div class="empty">No content</div></div>`;
  const heroImg = h.backdrop || h.poster;
  const meta = [h.year, h.type].filter(Boolean).join(" • ");
  return `<div class="hero" style="background-image:url('${esc(heroImg)}')">
    <h1>${esc(h.title)}</h1>
    <p>${esc(meta)}</p>
    <div class="acts">
      <button class="btn w" onclick="play('${esc(h.id)}','${esc(h.mediaType||'movie')}')">▶ Play</button>
      <button class="btn g" onclick="tg('${esc(h.id)}')">${inList(h.id)?"✓ My List":"＋ My List"}</button>
      <button class="btn g" style="flex:0 0 48px" onclick="openD('${esc(h.id)}','${esc(h.mediaType||'movie')}')">ⓘ</button>
    </div>
  </div>`
  + row("Trending Now", C.slice(0, 20))
  + row("More from TMDB", C.slice(20, 60));
}
function searchV(){
  return `<div class="pad"><div class="sb">
    <svg class="ic" viewBox="0 0 24 24" style="fill:#aaa"><path d="${ICO.search}"/></svg>
    <input id="qi" value="${esc(q)}" placeholder="Search movies, TV shows…" oninput="onSearch(this.value)">
  </div><div id="res">${resV(C)}</div></div>`;
}
function resV(arr){
  if(!q) return `<h2 style="margin-top:0">Trending</h2><div class="grid">${arr.slice(0,12).map(card).join("")}</div>`;
  return arr.length ? `<div class="grid">${arr.map(card).join("")}</div>` : `<div class="empty">No results for "${esc(q)}".<br>Try a different title.</div>`;
}
let searchTimer = null;
async function onSearch(v){
  q = v;
  clearTimeout(searchTimer);
  const r = $("#res");
  if(r) r.innerHTML = `<div class="empty">Searching…</div>`;
  searchTimer = setTimeout(async ()=>{
    try{
      const data = await apiGet("/search?q=" + encodeURIComponent(q));
      C = data.items || [];
      const rr = $("#res");
      if(rr) rr.innerHTML = resV(C);
    }catch(e){
      const rr = $("#res");
      if(rr) rr.innerHTML = `<div class="empty">Search failed</div>`;
    }
  }, 400);
}

function tg(id){
  const i = LIST.indexOf(id);
  if(i < 0) LIST.push(id); else LIST.splice(i, 1);
  sv("pm_list", LIST);
  toast(i < 0 ? "Added to My List" : "Removed");
  const y = scrollY; render(); scrollTo(0, y);
}

async function openD(id, type){
  $("#sh").classList.add("on");
  history.pushState({d:1}, "");
  $("#shc").innerHTML = `<div class="inf" style="padding-top:60px"><div class="empty">Loading…</div></div>`;
  try{
    const data = await apiGet("/detail?id=" + encodeURIComponent(id) + "&type=" + (type || "movie"));
    if(!data.ok || !data.item){ $("#shc").innerHTML = `<div class="inf" style="padding-top:60px"><div class="empty">Could not load</div></div>`; return; }
    const m = data.item;
    m.mediaType = type || m.mediaType || "movie";
    const p = PROG[m.id];
    const bg = m.backdrop || m.poster;
    const meta = [m.year, m.type, m.duration].filter(Boolean);
    $("#shc").innerHTML = `
      <div class="bd" style="background-image:url('${esc(bg)}')">
        <button class="x" onclick="history.back()" aria-label="Close">✕</button>
      </div>
      <div class="inf">
        <h1>${esc(m.title)}</h1>
        <div class="meta">
          ${m.rating ? `<em>${m.rating} ★</em>` : ""}
          ${meta.map(x => `<span>${esc(x)}</span>`).join("")}
          <b>HD</b>
        </div>
        <button class="btn w" onclick="play('${esc(m.id)}','${esc(m.mediaType)}')">▶ ${p && p.t > 3 ? "Resume" : "Play"}</button>
        <button class="btn g" onclick="tg('${esc(m.id)}')">${inList(m.id) ? "✓ In My List" : "＋ Add to My List"}</button>
        ${m.trailerKey ? `<button class="btn g" onclick="playTrailer('${esc(m.trailerKey)}','${esc(m.title)}')">▶ Watch Trailer</button>` : ""}
        ${m.description ? `<p>${esc(m.description)}</p>` : ""}
        ${m.genres && m.genres.length ? `<div class="meta">${m.genres.map(g => `<span>${esc(g)}</span>`).join("")}</div>` : ""}
      </div>`;
    $("#shc").scrollTop = 0;
  }catch(e){
    $("#shc").innerHTML = `<div class="inf" style="padding-top:60px"><div class="empty">Connection error</div></div>`;
  }
}

async function play(id, type){
  cur = C.find(x => x.id === id) || {id, title: "Movie", mediaType: type};
  $("#pt").textContent = cur.title || "Playing";
  $("#pl").classList.add("on");
  history.pushState({p:1}, "");
  $("#pf").innerHTML = `<div style="display:grid;place-items:center;height:100%;color:#888">Loading player…</div>`;
  try{
    const data = await apiGet("/play?id=" + encodeURIComponent(id) + "&type=" + (type || "movie"));
    if(!data.ok || !data.url){ $("#pf").innerHTML = `<div style="display:grid;place-items:center;height:100%;color:#f66;padding:20px;text-align:center">Stream not available</div>`; return; }
    $("#pf").innerHTML = `<iframe src="${esc(data.url)}" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="origin"></iframe>`;
  }catch(e){
    $("#pf").innerHTML = `<div style="display:grid;place-items:center;height:100%;color:#f66;padding:20px;text-align:center">Connection error</div>`;
  }
}
function playTrailer(key, title){
  $("#pt").textContent = title + " — Trailer";
  $("#pl").classList.add("on");
  history.pushState({p:1}, "");
  $("#pf").innerHTML = `<iframe src="https://www.youtube.com/embed/${esc(key)}?autoplay=1&rel=0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
}
function stop(){
  $("#pl").classList.remove("on");
  $("#pf").innerHTML = "";
  if(cur && cur.id && PROG[cur.id]) sv("pm_prog", PROG);
}

addEventListener("popstate", ()=>{ if($("#pl").classList.contains("on")) stop(); else $("#sh").classList.remove("on"); });
$("#sh").addEventListener("click", e => { if(e.target.id == "sh") history.back(); });
addEventListener("scroll", ()=> $("#hd").classList.toggle("s", scrollY > 40), {passive:true});
setInterval(()=>{
  if(tab=="home" && !$("#sh").classList.contains("on") && !$("#pl").classList.contains("on") && scrollY < 10 && C.length){
    heroI++; render();
  }
}, 8000);

(async function(){
  try{
    const data = await apiGet("/home");
    C = data.items || [];
  }catch(e){ C = []; }
  render();
  setTimeout(()=> $("#splash").classList.add("off"), 1200);
})();
</script></body></html>

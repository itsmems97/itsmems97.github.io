function clearHistory() { state.watched = []; saveWatched(); state.epProgress = {}; saveEp(); toast(t('cleared'), 'trash'); renderProfileScreen(); if (state.homeLoaded) renderRows(); }
function clearList() { state.list = []; saveList(); toast(t('cleared'), 'trash'); renderProfileScreen(); }
function clearRecent() { state.recent = []; saveRecent(); toast(t('cleared'), 'trash'); if (state.screen === 'search') renderSearchBody(); }

/* ============================================
   SECTION 12 — DETAIL MODAL
   ============================================ */
function openDetail(id) {
  const item = getItem(id);
  if (!item) return;
  state.detail.item = item;
  state.detail.token++;
  state.detail.season = 1;
  const token = state.detail.token;
  renderSheet(item, true);
  $('#sheet-backdrop').classList.add('open');
  $('#sheet').classList.add('open');
  $('#sheet').scrollTop = 0;
  document.body.classList.add('no-scroll');
  fetchDetail(item).then((full) => {
    if (token !== state.detail.token) return;
    state.detail.item = full;
    renderSheet(full, false);
    maybeAutoplayTrailer(full, token);
  }).catch(() => {
    if (token !== state.detail.token) return;
    renderSheet(item, false);
  });
}

function closeSheet(instant = false) {
  const sheet = $('#sheet');
  if (!sheet.classList.contains('open')) return;
  state.detail.token++;
  sheet.classList.remove('open');
  $('#sheet-backdrop').classList.remove('open');
  if (!$('#player').classList.contains('open')) document.body.classList.remove('no-scroll');
  const ifr = $('#sheet-trailer');
  if (ifr) ifr.remove();
}

function castHtml(item) {
  if (item.cast && item.cast.length) {
    return `<div class="cast-row">${item.cast.slice(0, 14).map((c) => {
      const name = typeof c === 'string' ? c : (c.name || '');
      const photo = typeof c === 'object' ? (c.photo || c.profile || c.image || '') : '';
      const h = hueFromString(name);
      return `<div class="cast-item"><div class="cast-avatar" style="background:linear-gradient(135deg,hsl(${h},65%,45%),hsl(${(h + 50) % 360},65%,25%))">${photo ? `<img src="${escapeHtml(photo)}" alt="${escapeHtml(name)}" loading="lazy" onerror="this.remove()">` : escapeHtml(initials(name))}</div><div class="cast-name">${escapeHtml(name)}</div></div>`;
    }).join('')}</div>`;
  }
  return `<p class="muted">${t('noCast')}</p>`;
}

function moreLikeThis(item) {
  const pool = state.homeItems.concat(Array.from(state.itemCache.values()));
  const seen = new Set([String(item.id)]);
  const genres = (item.genres || []).map((g) => g.toLowerCase());
  const scored = [];
  pool.forEach((p) => {
    if (seen.has(String(p.id)) || !p.poster) return;
    seen.add(String(p.id));
    let score = p.type === item.type ? 2 : 0;
    (p.genres || []).forEach((g) => { if (genres.includes(g.toLowerCase())) score += 3; });
    score += (p.rating || 0) / 10;
    scored.push({ p, score });
  });
  return scored.sort((a, b) => b.score - a.score).slice(0, 14).map((s) => s.p);
}

function renderSheet(item, loading) {
  const isTv = item.type === 'tv';
  const saved = inList(item.id);
  const fav = isFav(item.id);
  const more = moreLikeThis(item);
  const backdrop = imgUrl(item.backdrop || item.poster, 'backdrop');
  const watched = getWatched(item.id);
  $('#sheet').innerHTML = `
    <div class="sheet-grab" aria-hidden="true"></div>
    <button class="sheet-close ripple" data-action="close-sheet" aria-label="Close details">${icon('close', 22)}</button>
    <div class="sheet-hero" id="sheet-hero">${backdrop ? `<img src="${escapeHtml(backdrop)}" alt="${escapeHtml(item.title)}">` : ''}</div>
    <div class="sheet-body">
      <h2 class="sheet-title">${escapeHtml(item.title)}</h2>
      <div class="sheet-meta">
        ${item.year ? `<span>${escapeHtml(item.year)}</span>` : ''}
        ${item.duration ? `<span>• ${escapeHtml(displayDuration(item.duration))}</span>` : (loading ? '<span class="skeleton" style="width:50px;height:14px;border-radius:7px"></span>' : '')}
        ${item.rating > 0 ? `<span class="rate">${icon('star-filled', 15)}${formatRating(item.rating)}</span>` : ''}
        <span class="hd-badge">HD</span>
        <span>${isTv ? t('tv') : t('movie')}</span>
      </div>
      <div class="sheet-actions">
        <button class="btn btn-primary ripple" data-action="play" data-id="${escapeHtml(item.id)}">${icon('play', 20)}<span>${watched && watched.progress > 1 && watched.progress < 95 ? t('continueWatching') : t('play')}</span></button>
        <button class="btn btn-glass ripple ${saved ? 'is-saved' : ''}" id="sheet-list-btn" data-action="toggle-list" data-id="${escapeHtml(item.id)}" aria-label="${t('myList')}">${icon(saved ? 'bookmark-filled' : 'plus', 20)}<span>${t('myList')}</span></button>
        <button class="btn btn-glass btn-round ripple" data-action="share" data-id="${escapeHtml(item.id)}" aria-label="${t('share')}">${icon('share', 20)}</button>
        <button class="btn btn-glass btn-round ripple ${fav ? 'is-fav' : ''}" data-action="toggle-fav" data-id="${escapeHtml(item.id)}" aria-label="${t('fav')}" id="sheet-fav-btn">${icon(fav ? 'heart-filled' : 'heart', 20)}</button>
        ${item.trailerKey ? `<button class="btn btn-glass ripple" data-action="trailer" data-id="${escapeHtml(item.id)}">${icon('film', 18)}<span>${t('trailer')}</span></button>` : ''}
      </div>
      <p class="sheet-desc">${escapeHtml(item.description || '')}</p>
      ${item.genres && item.genres.length ? `<div class="genre-row">${item.genres.map((g) => `<span class="chip">${escapeHtml(g)}</span>`).join('')}</div>` : ''}
      ${isTv ? `<div id="episode-section"></div>` : ''}
      <h3 class="sheet-h">${t('cast')}</h3>
      ${loading ? `<div class="cast-row">${Array.from({ length: 6 }, () => '<div class="skeleton" style="width:68px;height:68px;border-radius:50%;flex:0 0 auto"></div>').join('')}</div>` : castHtml(item)}
      ${more.length ? `<div class="sheet-more"><h3 class="sheet-h">${t('moreLikeThis')}</h3><div class="row-scroll">${more.map((m) => posterCard(m, { showType: false })).join('')}</div></div>` : ''}
    </div>`;
  if (isTv) renderEpisodeSection($('#episode-section'), item, state.detail.season, false);
  animateBars($('#sheet'));
}

function maybeAutoplayTrailer(item, token) {
  if (!item.trailerKey || !state.settings.autoplayTrailer || state.settings.dataSaver || prefersReducedMotion()) return;
  setTimeout(() => {
    if (token !== state.detail.token) return;
    const hero = $('#sheet-hero');
    if (!hero || $('#sheet-trailer')) return;
    const ifr = document.createElement('iframe');
    ifr.id = 'sheet-trailer';
    ifr.title = 'Trailer preview';
    ifr.allow = 'autoplay; encrypted-media';
    ifr.setAttribute('loading', 'lazy');
    ifr.src = `https://www.youtube.com/embed/${encodeURIComponent(item.trailerKey)}?autoplay=1&mute=1&controls=0&loop=1&playlist=${encodeURIComponent(item.trailerKey)}&modestbranding=1&playsinline=1&rel=0`;
    ifr.addEventListener('load', () => ifr.classList.add('on'));
    hero.appendChild(ifr);
  }, 1400);
}

async function shareItem(id) {
  const item = getItem(id);
  if (!item) return;
  const text = `${item.title}${item.year ? ' (' + item.year + ')' : ''} — watch on PIKA MOVIE`;
  const url = location.href.split('#')[0];
  try {
    if (navigator.share) { await navigator.share({ title: item.title, text, url }); return; }
  } catch (err) { if (err && err.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(`${text}\n${url}`); toast(t('copied'), 'share'); }
  catch (err) { toast(text, 'share'); }
}

function toggleFav(id, el) {
  id = String(id);
  if (isFav(id)) { state.favs = state.favs.filter((x) => x !== id); toast(t('favRemoved'), 'heart'); }
  else { state.favs.unshift(id); toast(t('favAdded'), 'heart-filled'); burst(el); persistCacheFor([id]); }
  saveFavs();
  const btn = $('#sheet-fav-btn');
  if (btn) { btn.innerHTML = icon(isFav(id) ? 'heart-filled' : 'heart', 20); btn.classList.toggle('is-fav', isFav(id)); }
}

/* Episode picker */
function seasonCount(item) {
  const n = Number(item.seasons);
  return n > 0 ? Math.min(n, 30) : CONFIG.DEFAULT_SEASONS;
}
function episodeKey(season, episode) { return `s${season}e${episode}`; }
function episodeProgress(id, season, episode) {
  const rec = state.epProgress[String(id)];
  return rec && rec[episodeKey(season, episode)] ? rec[episodeKey(season, episode)] : 0;
}

function renderEpisodeSection(host, item, season, inPlayer) {
  if (!host) return;
  const seasons = seasonCount(item);
  const thumb = imgUrl(item.backdrop || item.poster, 'backdrop');
  const eps = Array.from({ length: CONFIG.DEFAULT_EPISODES }, (_, i) => i + 1);
  const opts = Array.from({ length: seasons }, (_, i) => `<option value="${i + 1}" ${i + 1 === season ? 'selected' : ''}>${t('season')} ${i + 1}</option>`).join('');
  host.innerHTML = `
    <div class="ep-head"><h3>${t('episodes')}</h3><span class="select-wrap"><select class="season-select" aria-label="${t('season')}">${opts}</select><span class="chev">${icon('chevron-down', 16)}</span></span></div>
    <div class="ep-grid">${eps.map((n) => {
      const pr = episodeProgress(item.id, season, n);
      return `<div class="ep-card glass" data-action="play-episode" data-id="${escapeHtml(item.id)}" data-season="${season}" data-episode="${n}" role="button" tabindex="0" aria-label="${t('play')} ${t('season')} ${season} ${t('episode')} ${n}">
        <div class="ep-thumb">${thumb ? `<img src="${escapeHtml(thumb)}" alt="" loading="lazy" style="object-position:${(n * 17) % 100}% 50%">` : ''}<span class="num">${n}</span><span class="play-ov">${icon('play', 26)}</span>${pr > 0 ? `<div class="bar"><i data-w="${pr}"></i></div>` : ''}</div>
        <div class="ep-info"><div class="ep-title">${t('episode')} ${n}</div><div class="ep-dur">${t('season')} ${season} • ${CONFIG.EPISODE_RUNTIME_MIN}${t('min') === 'min' ? ' min' : ' ' + t('min')}</div></div>
        <span class="ep-play">${icon('play', 18)}</span>
      </div>`;
    }).join('')}</div>`;
  const sel = $('.season-select', host);
  sel.addEventListener('change', (e) => {
    const s = parseInt(e.target.value, 10) || 1;
    if (inPlayer) state.player.season = s; else state.detail.season = s;
    renderEpisodeSection(host, item, s, inPlayer);
  });
  animateBars(host);
}

/* ============================================
   SECTION 13 — VIDEO PLAYER
   ============================================ */
function openPlayer(item, opts = {}) {
  if (!item) return;
  const p = state.player;
  p.item = item;
  p.season = opts.season || 1;
  p.episode = opts.episode || 1;
  p.mode = opts.trailer ? 'trailer' : 'movie';
  p.providers = [];
  p.startedAt = Date.now();
  const prev = getWatched(item.id);
  p.baseProgress = prev && item.type !== 'tv' ? prev.progress : (item.type === 'tv' ? episodeProgress(item.id, p.season, p.episode) : 0);
  if (p.baseProgress >= 95) p.baseProgress = 0;
  $('#player-title').innerHTML = `${escapeHtml(item.title)}${item.type === 'tv' && !opts.trailer ? `<small>${t('season')} ${p.season} • ${t('episode')} ${p.episode}</small>` : (opts.trailer ? `<small>${t('trailer')}</small>` : '')}`;
$('#player-eps').classList.toggle('hidden', item.type !== 'tv' || !!opts.trailer);
$('#player-pip').classList.toggle('hidden', !!opts.trailer);
  $('#provider-row').innerHTML = '';
  $('#ep-drawer').classList.remove('open');
  closeSheet(true);
  $('#player').classList.add('open');
  document.body.classList.add('no-scroll');
  stopHeroTimer();
  if (opts.trailer) { loadFrame(`https://www.youtube.com/embed/${encodeURIComponent(item.trailerKey)}?autoplay=1&rel=0&playsinline=1`); return; }
  loadFrame(embedUrl(item, p.season, p.episode));
  recordWatch(item, true);
  clearInterval(p.timer);
  p.timer = setInterval(() => recordWatch(item, false), 15000);
  fetchPlay(item).then((data) => {
    if (state.player.item !== item) return;
    const list = Array.isArray(data.providers) ? data.providers : [];
    state.player.providers = list.length ? list : (data.url ? [{ name: 'Default', url: data.url }] : []);
    renderProviders();
  }).catch(() => { renderProviders(); });
}

function loadFrame(url) {
  const frame = $('#player-frame');
  const loading = $('#player-loading');
  const old = $('iframe', frame);
  if (old) old.remove();
  const oldErr = $('.player-error', frame);
  if (oldErr) oldErr.remove();

  loading.classList.remove('done');
  state.player.currentUrl = url;
  state.player.loadedOk = false;
  if (state.player.loadTimer) clearTimeout(state.player.loadTimer);

  const ifr = document.createElement('iframe');
  ifr.title = state.player.item ? state.player.item.title : 'Video';
  ifr.allow = 'autoplay; fullscreen; picture-in-picture; encrypted-media';
  ifr.allowFullscreen = true;
  ifr.setAttribute('referrerpolicy', 'no-referrer');
  ifr.addEventListener('load', () => {
    state.player.loadedOk = true;
    if (state.player.loadTimer) clearTimeout(state.player.loadTimer);
    setTimeout(() => loading.classList.add('done'), 400);
  });
  ifr.src = url;
  frame.insertBefore(ifr, loading);

  state.player.loadTimer = setTimeout(() => {
    if (state.player.loadedOk) return;
    loading.classList.add('done');
    showPlayerError();
  }, 9000);
}

function showPlayerError() {
  const frame = $('#player-frame');
  if (!frame) return;
  const existing = $('.player-error', frame);
  if (existing) return;
  const box = document.createElement('div');
  box.className = 'player-error';
  const item = state.player.item;
  const title = item ? item.title : 'this title';
  box.innerHTML = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 8v5"/>
      <circle cx="12" cy="16.5" r="0.9" fill="currentColor" stroke="none"/>
    </svg>
    <h3>Stream unavailable</h3>
    <p>We couldn't load the player for "${escapeHtml(title)}". The source might be offline, blocked on your network, or missing this title. Try another server or open it in a new tab.</p>
<div class="actions">
  <button class="btn btn-retry ripple" data-action="player-retry">${icon('refresh', 18)}<span>Retry</span></button>
  <button class="btn btn-secondary ripple" data-action="player-next-server">${icon('cast', 18)}<span>Try next server</span></button>
</div>`;
  frame.appendChild(box);
  requestAnimationFrame(() => box.classList.add('show'));
}

function hidePlayerError() {
  const box = $('#player-frame .player-error');
  if (box) { box.classList.remove('show'); setTimeout(() => box.remove(), 400); }
}

function retryPlayer() {
  hidePlayerError();
  if (state.player.currentUrl) loadFrame(state.player.currentUrl);
}

function nextServer() {
  hidePlayerError();
  const p = state.player;
  const list = p.providers || [];
  if (!list.length) { retryPlayer(); return; }
  const cur = p.currentProvider === undefined ? -1 : p.currentProvider;
  const next = cur + 1 >= list.length ? -1 : cur + 1;
  switchProvider(next);
}

/* openExternalFromError() removed — no longer needed without the external button. */

function renderProviders() {
  const row = $('#provider-row');
  const list = state.player.providers;
  const current = state.player.currentProvider === undefined ? -1 : state.player.currentProvider;
  const proxyChip = `<button class="chip ripple ${current === -1 ? 'active' : ''}" data-action="provider" data-index="-1">PIKA</button>`;
  // Provider names ko mask karo — real names user ko na dikhein
  row.innerHTML = proxyChip + list.map((p, i) => {
    const maskedName = 'PIKA ' + String.fromCharCode(65 + (i % 26));
    return `<button class="chip ripple ${current === i ? 'active' : ''}" data-action="provider" data-index="${i}">${escapeHtml(maskedName)}</button>`;
  }).join('');
}

function switchProvider(index) {
  const p = state.player;
  p.currentProvider = index;
  if (index === -1) loadFrame(embedUrl(p.item, p.season, p.episode));
  else if (p.providers[index]) loadFrame(withEpisode(p.providers[index].url, p.item, p.season, p.episode));
  renderProviders();
}
function withEpisode(url, item, season, episode) {
  if (item.type !== 'tv' || !url) return url;
  if (/[?&]season=/.test(url)) return url;
  return url + (url.includes('?') ? '&' : '?') + `season=${season}&episode=${episode}`;
}

function recordWatch(item, initial) {
  const p = state.player;
  const elapsed = Math.floor((Date.now() - p.startedAt) / 1000);
  const runtime = parseDurationMinutes(item.duration, item.type === 'tv') * 60;
  const progress = clamp(Math.round(p.baseProgress + (elapsed / runtime) * 100), initial ? Math.max(1, Math.round(p.baseProgress)) : 1, 100);
  let rec = getWatched(item.id);
  if (!rec) {
    rec = { id: String(item.id), title: item.title, poster: item.poster, backdrop: item.backdrop, progress: progress, timestamp: Date.now(), mediaType: item.type, year: item.year, watchSeconds: 0 };
    state.watched.unshift(rec);
  }
  rec.progress = Math.max(progress, initial ? rec.progress : 0);
  rec.timestamp = Date.now();
  rec.mediaType = item.type;
  if (item.type === 'tv') { rec.season = p.season; rec.episode = p.episode; }
  if (!initial) rec.watchSeconds = (Number(rec.watchSeconds) || 0) + 15;
  state.watched = state.watched.slice(0, 100);
  saveWatched();
  if (item.type === 'tv') {
    const key = String(item.id);
    state.epProgress[key] = state.epProgress[key] || {};
    state.epProgress[key][episodeKey(p.season, p.episode)] = clamp(progress, 0, 100);
    saveEp();
  }
  persistCacheFor([item.id]);
}

function closePlayer() {
  const p = state.player;
  if (p.timer) { clearInterval(p.timer); p.timer = null; }
  if (p.loadTimer) { clearTimeout(p.loadTimer); p.loadTimer = null; }
  hidePlayerError();
  if (p.item && p.mode !== 'trailer') recordWatch(p.item, true);
  const frame = $('#player-frame');
  const ifr = $('iframe', frame);
  if (ifr) ifr.remove();
  $('#player').classList.remove('open');
  $('#ep-drawer').classList.remove('open');
  if (document.fullscreenElement) { try { document.exitFullscreen(); } catch (err) { /* ignore */ } }
  document.body.classList.remove('no-scroll');
  p.currentProvider = undefined;
  p.item = null;
  if (state.screen === 'home') { renderRows(); startHeroTimer(); }
  if (state.screen === 'profile') renderProfileScreen();
}

function toggleFullscreen() {
  const el = $('#player');
  try {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      (el.requestFullscreen || el.webkitRequestFullscreen || function () { throw new Error('unsupported'); }).call(el);
    }
  } catch (err) { toast('Fullscreen is not supported here', 'info'); }
}

async function togglePip() {
  try {
    const ifr = $('#player-frame iframe');
    let video = null;
    try { video = ifr && ifr.contentDocument ? ifr.contentDocument.querySelector('video') : null; } catch (err) { video = null; }
    if (video && document.pictureInPictureEnabled) {
      if (document.pictureInPictureElement) await document.exitPictureInPicture();
      else await video.requestPictureInPicture();
      return;
    }
    toast(t('pipUnavailable'), 'info');
  } catch (err) { toast(t('pipUnavailable'), 'info'); }
}

/* openExternal() was removed — opening raw provider URLs exposed the backend.
   All playback now stays inside the Pika Movie proxied player. */

function openEpisodeDrawer() {
  const p = state.player;
  if (!p.item) return;
  const drawer = $('#ep-drawer');
  drawer.innerHTML = `<div class="ep-head" style="margin-top:0"><h3>${escapeHtml(p.item.title)}</h3><button class="icon-btn glass ripple" data-action="close-drawer" aria-label="Close episodes">${icon('close', 20)}</button></div><div id="drawer-eps"></div>`;
  renderEpisodeSection($('#drawer-eps'), p.item, p.season, true);
  drawer.classList.add('open');
}

function playEpisode(id, season, episode) {
  const item = getItem(id);
  if (!item) return;
  openPlayer(item, { season, episode });
}

/* ============================================
   SECTION 14 — THEME SYSTEM
   ============================================ */
function applyTheme(theme, persist = true) {
  state.theme = theme === 'light' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', state.theme);
  const meta = $('#meta-theme-color');
  if (meta) meta.setAttribute('content', state.theme === 'dark' ? '#000000' : '#f5f5f7');
  if (persist) store.setRaw(CONFIG.KEYS.theme, state.theme);
  $('#theme-toggle').setAttribute('aria-label', state.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
  if (state.screen === 'profile' && persist) renderProfileScreen();
}
function toggleTheme() { applyTheme(state.theme === 'dark' ? 'light' : 'dark'); }

/* ============================================
   SECTION 15 — LANGUAGE SYSTEM
   ============================================ */
function applyStaticTranslations() {
  $$('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.documentElement.lang = state.lang === 'ur' ? 'ur' : 'en';
  document.documentElement.dir = state.lang === 'ur' ? 'rtl' : 'ltr';
  $('#search-input').placeholder = t('searchPlaceholder');
}

async function setLanguage(lang) {
  if (lang === state.lang) return;
  state.lang = lang === 'ur' ? 'ur' : 'en';
  store.setRaw(CONFIG.KEYS.lang, state.lang);
  applyStaticTranslations();
  apiCache.clear();
  if (state.screen === 'profile') renderProfileScreen();
  if (state.screen === 'list') renderListScreen();
  if (state.screen === 'search') renderSearchScreen();
  state.homeLoaded = false;
  loadHome(true).then(() => {
    if (state.screen === 'profile') renderProfileScreen();
    /* Reposition liquid nav (layout may have shifted with language change) */
    navLiquidReady = false;
    const btn = document.querySelector('.nav-btn.active');
    if (btn) requestAnimationFrame(() => moveNavLiquid(btn));
  });
}

/* ============================================
   SECTION 16 — EVENT LISTENERS
   ============================================ */
function handleAction(el, e) {
  const a = el.dataset.action;
  const id = el.dataset.id;
  switch (a) {
    case 'open-detail': openDetail(id); break;
    case 'play': {
      const item = getItem(id);
      if (item && item.type === 'tv') {
        const rec = getWatched(id);
        openPlayer(item, { season: (rec && rec.season) || 1, episode: (rec && rec.episode) || 1 });
      } else openPlayer(item);
      break;
    }
    case 'play-episode': playEpisode(id, parseInt(el.dataset.season, 10), parseInt(el.dataset.episode, 10)); break;
    case 'toggle-list': toggleList(id, el); break;
    case 'remove-list': removeFromList(id, el.closest('.card')); break;
    case 'toggle-fav': toggleFav(id, el); break;
    case 'share': shareItem(id); break;
    case 'trailer': { const it = getItem(id); if (it && it.trailerKey) openPlayer(it, { trailer: true }); else toast(t('noTrailer'), 'info'); break; }
    case 'close-sheet': closeSheet(); break;
    case 'hero-go': heroGo(parseInt(el.dataset.index, 10)); break;
    case 'see-all': openCollection(el.dataset.key); break;
    case 'collection-back': navigate(state.prevScreen && state.prevScreen !== 'collection' ? state.prevScreen : 'home'); break;
    case 'go-home': navigate('home'); break;
    case 'search-filter': state.search.filter = el.dataset.filter; renderSearchFilters(); renderSearchBody(); break;
    case 'use-recent': { const q = el.dataset.q; $('#search-input').value = q; runSearch(q); break; }
    case 'remove-recent': { const idx = parseInt(el.dataset.index, 10); state.recent.splice(idx, 1); saveRecent(); renderSearchBody(); break; }
    case 'clear-recent': clearRecent(); break;
    case 'list-filter': state.listView.filter = el.dataset.filter; renderListScreen(); break;
    case 'set-theme': applyTheme(el.dataset.theme); break;
    case 'set-lang': setLanguage(el.dataset.lang); break;
    case 'toggle-setting': {
      const k = el.dataset.key;
      state.settings[k] = !state.settings[k];
      saveSettings();
      el.classList.toggle('on', state.settings[k]);
      el.setAttribute('aria-checked', String(state.settings[k]));
      break;
    }
    case 'clear-history': clearHistory(); break;
    case 'clear-list': clearList(); break;
    case 'clear-recent-all': clearRecent(); break;
    case 'remove-history': {
      state.watched = state.watched.filter((w) => String(w.id) !== String(id));
      saveWatched();
      delete state.epProgress[String(id)];
      saveEp();
      renderProfileScreen();
      break;
    }
    case 'toggle-about': { const c = $('#about-card'); if (c) { c.classList.toggle('hidden'); if (!c.classList.contains('hidden')) c.scrollIntoView({ behavior: 'smooth', block: 'center' }); } break; }
    case 'provider': switchProvider(parseInt(el.dataset.index, 10)); break;
    case 'close-drawer': $('#ep-drawer').classList.remove('open'); break;
    case 'player-retry': retryPlayer(); break;
    case 'player-next-server': nextServer(); break;
    default: break;
  }
}

function initEventListeners() {
  document.addEventListener('pointerdown', attachRipple, { passive: true });

  document.addEventListener('click', (e) => {
    const nav = e.target.closest('[data-nav]');
    if (nav) { navigate(nav.dataset.nav); return; }
    const el = e.target.closest('[data-action]');
    if (!el) return;
    // inner buttons win over their card
    handleAction(el, e);
  });

  document.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.card, .history-item, .ep-card')) {
      e.preventDefault();
      const el = e.target.closest('[data-action]');
      if (el) handleAction(el, e);
    }
    if (e.key === 'Escape') {
      if ($('#ep-drawer').classList.contains('open')) $('#ep-drawer').classList.remove('open');
      else if ($('#player').classList.contains('open')) closePlayer();
      else if ($('#sheet').classList.contains('open')) closeSheet();
    }
  });

  $('#theme-toggle').addEventListener('click', toggleTheme);

  const input = $('#search-input');
  input.addEventListener('input', () => {
    const v = input.value;
    $('#search-clear').classList.toggle('show', !!v);
    if (!v.trim()) { state.search.token++; runSearch(''); return; }
    debouncedSearch(v);
  });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); runSearch(input.value); input.blur(); } });
  $('#search-clear').addEventListener('click', () => { input.value = ''; state.search.token++; runSearch(''); input.focus(); });

$('#player-back').addEventListener('click', closePlayer);
$('#player-fs').addEventListener('click', toggleFullscreen);
$('#player-pip').addEventListener('click', togglePip);
  $('#player-eps').addEventListener('click', openEpisodeDrawer);

  /* Swipe down to dismiss the bottom sheet */
  const sheet = $('#sheet');
  let startY = 0, dragging = false, delta = 0;
  sheet.addEventListener('touchstart', (e) => { if (sheet.scrollTop <= 0) { startY = e.touches[0].clientY; dragging = true; delta = 0; } }, { passive: true });
  sheet.addEventListener('touchmove', (e) => {
    if (!dragging) return;
    delta = e.touches[0].clientY - startY;
    if (delta > 0 && sheet.scrollTop <= 0) {
      sheet.style.transition = 'none';
      sheet.style.transform = `translate(-50%, ${delta}px)`;
    }
  }, { passive: true });
  sheet.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
    sheet.style.transition = '';
    sheet.style.transform = '';
    if (delta > 140) closeSheet();
  });

  window.addEventListener('popstate', () => {
    if ($('#player').classList.contains('open')) closePlayer();
    else if ($('#sheet').classList.contains('open')) closeSheet();
    else { const h = location.hash.replace('#', ''); if (SCREENS.includes(h)) navigate(h, { silent: true }); }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopHeroTimer(); else if (state.screen === 'home' && state.homeLoaded) startHeroTimer();
  });

  window.matchMedia('(prefers-color-scheme: light)').addEventListener && window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { /* user choice persists */ });
}

/* Pull-to-refresh for the Home screen (mobile) */
function initPullToRefresh() {
  const ptr = document.getElementById('ptr');
  if (!ptr) return;
  const THRESHOLD = 78;
  const MAX_PULL = 130;
  let startY = 0;
  let pulling = false;
  let dist = 0;
  let triggered = false;
  let refreshing = false;

  function reset() {
    ptr.classList.remove('visible', 'ready', 'spinning', 'pulse');
    ptr.style.transform = 'translate(-50%, -80px)';
    ptr.style.opacity = '';
    dist = 0;
    pulling = false;
    triggered = false;
  }

  document.addEventListener('touchstart', (e) => {
    if (refreshing) return;
    if (state.screen !== 'home') return;
    if (window.scrollY > 0) return;
    if ($('#sheet').classList.contains('open') || $('#player').classList.contains('open')) return;
    if (e.touches.length !== 1) return;
    startY = e.touches[0].clientY;
    pulling = true;
    dist = 0;
    triggered = false;
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (!pulling || triggered || refreshing) return;
    if (state.screen !== 'home') { reset(); return; }
    if (window.scrollY > 0) { reset(); return; }
    const dy = e.touches[0].clientY - startY;
    if (dy <= 0) { reset(); return; }
    if (e.cancelable) e.preventDefault();
    dist = Math.min(MAX_PULL, dy * 0.55);
    const progress = Math.min(1, dist / THRESHOLD);
    ptr.classList.add('visible');
    ptr.style.transform = 'translate(-50%, ' + (dist - 46) + 'px) scale(' + (0.7 + progress * 0.35) + ')';
    ptr.style.opacity = String(0.4 + progress * 0.6);
    ptr.classList.toggle('ready', dist >= THRESHOLD);
  }, { passive: false });

  document.addEventListener('touchend', async () => {
    if (!pulling || refreshing) return;
    pulling = false;
    if (dist >= THRESHOLD) {
      triggered = true;
      refreshing = true;
      ptr.classList.add('visible', 'ready', 'spinning');
      ptr.style.transform = 'translate(-50%, 14px) scale(1)';
      ptr.style.opacity = '1';
      state.homeLoaded = false;
      apiCache.clear();
      try {
        await loadHome(true);
        ptr.classList.remove('spinning');
        ptr.classList.add('pulse');
        toast('Refreshed', 'refresh');
        setTimeout(() => { reset(); refreshing = false; }, 600);
      } catch (err) {
        ptr.classList.remove('spinning');
        toast('Could not refresh', 'info');
        setTimeout(() => { reset(); refreshing = false; }, 400);
      }
    } else {
      reset();
    }
  }, { passive: true });
}

/* ============================================
   SECTION 17 — INITIALIZATION
   ============================================ */
/* ============================================
   SECTION 16.5 — LIQUID BOTTOM NAV
   ============================================ */
let navLiquidReady = false;

function moveNavLiquid(btn) {
  const liquid = document.getElementById('nav-liquid');
  const nav = document.getElementById('bottom-nav');
  if (!liquid || !nav || !btn) return;

  const navRect = nav.getBoundingClientRect();
  const btnRect = btn.getBoundingClientRect();
  if (!navRect.width || !btnRect.width) return;

  const targetX = btnRect.left - navRect.left;
  const targetW = btnRect.width;

  /* First paint: snap into place without animation */
  if (!navLiquidReady) {
    liquid.style.transition = 'none';
    liquid.style.width = targetW + 'px';
    liquid.style.transform = `translateX(${targetX}px)`;
    void liquid.offsetWidth;
    liquid.style.transition = '';
    liquid.dataset.x = targetX;
    liquid.dataset.w = targetW;
    navLiquidReady = true;
    return;
  }

  const prevX = parseFloat(liquid.dataset.x || targetX);

  /* Same tab? skip */
  if (Math.abs(prevX - targetX) < 0.5 && Math.abs(parseFloat(liquid.dataset.w || 0) - targetW) < 0.5) {
    return;
  }

  liquid.dataset.x = targetX;
  liquid.dataset.w = targetW;

  /* Position + size (transition animates) */
  liquid.style.width = targetW + 'px';
  liquid.style.transform = `translateX(${targetX}px)`;

  /* Trigger a fresh morph animation */
  liquid.classList.remove('morph');
  void liquid.offsetWidth;
  liquid.classList.add('morph');
  clearTimeout(liquid._morphTimer);
  liquid._morphTimer = setTimeout(() => liquid.classList.remove('morph'), 720);
}

function initNavLiquid() {
  const liquid = document.getElementById('nav-liquid');
  const nav = document.getElementById('bottom-nav');
  if (!liquid || !nav) return;

  /* Position on the currently active tab */
  const activeBtn = document.querySelector('.nav-btn.active') || document.querySelector('.nav-btn');
  if (activeBtn) {
    /* Wait two frames so layout + fonts have settled */
    requestAnimationFrame(() => requestAnimationFrame(() => moveNavLiquid(activeBtn)));
  }

  /* Reposition on window resize / orientation change */
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      navLiquidReady = false;
      const btn = document.querySelector('.nav-btn.active');
      if (btn) moveNavLiquid(btn);
    }, 140);
  });

  /* Reposition once fonts load (text width might shift buttons) */
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => {
      navLiquidReady = false;
      const btn = document.querySelector('.nav-btn.active');
      if (btn) moveNavLiquid(btn);
    });
  }
}

/* ============================================
   SECTION 16.6 — LIQUID SWIPE GESTURE
   Finger drag karo nav pe, blob finger ko follow kare,
   release pe nearest tab pe navigate ho jaye.
   ============================================ */
function initNavSwipe() {
  const nav = document.getElementById('bottom-nav');
  const liquid = document.getElementById('nav-liquid');
  if (!nav || !liquid) return;

  const HORIZONTAL_THRESHOLD = 6;
  const VERTICAL_CANCEL_RATIO = 1.3;

  let dragging = false;
  let startX = 0;
  let startY = 0;
  let liquidW = 0;
  let hoverIndex = -1;

  const getButtons = () => Array.from(nav.querySelectorAll('.nav-btn'));

  function navRect() { return nav.getBoundingClientRect(); }

  function buttonRects() {
    const nr = navRect();
    return getButtons().map((b) => {
      const r = b.getBoundingClientRect();
      return {
        left: r.left - nr.left,
        width: r.width,
        center: (r.left - nr.left) + r.width / 2
      };
    });
  }

  function nearestIndex(localX) {
    const arr = buttonRects();
    let best = 0;
    let bestDist = Infinity;
    for (let i = 0; i < arr.length; i++) {
      const d = Math.abs(localX - arr[i].center);
      if (d < bestDist) { bestDist = d; best = i; }
    }
    return best;
  }

  function setHover(idx) {
    if (idx === hoverIndex) return;
    hoverIndex = idx;
    getButtons().forEach((b, i) => b.classList.toggle('active', i === idx));
  }

  function setLiquidX(left) {
    liquid.style.transition = 'none';
    liquid.style.transform = `translateX(${left}px)`;
    liquid.dataset.x = left;
  }

  function restoreToActive() {
    liquid.style.transition = '';
    const buttons = getButtons();
    const activeIdx = buttons.findIndex((b) => b.classList.contains('active'));
    if (activeIdx >= 0) {
      navLiquidReady = true;
      moveNavLiquid(buttons[activeIdx]);
    }
  }

  function onStart(e) {
    if (e.touches.length !== 1) return;
    if (document.getElementById('player').classList.contains('open')) return;
    if (document.getElementById('sheet').classList.contains('open')) return;

    const t = e.touches[0];
    const nr = navRect();
    const localX = t.clientX - nr.left;
    const localY = t.clientY - nr.top;
    if (localX < -16 || localX > nr.width + 16) return;
    if (localY < -24 || localY > nr.height + 24) return;

    dragging = true;
    startX = t.clientX;
    startY = t.clientY;
    const lr = liquid.getBoundingClientRect();
    liquidW = lr.width || parseFloat(liquid.dataset.w || 0);
    hoverIndex = -1;
    liquid.style.transition = 'none';
  }

  function onMove(e) {
    if (!dragging) return;
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;

    if (Math.abs(dx) < HORIZONTAL_THRESHOLD && Math.abs(dy) < HORIZONTAL_THRESHOLD) return;

    // Agar user vertical scroll kar raha hai, cancel karo
    if (Math.abs(dy) > Math.abs(dx) * VERTICAL_CANCEL_RATIO) {
      dragging = false;
      restoreToActive();
      return;
    }

    if (e.cancelable) e.preventDefault();

    const nr = navRect();
    const localX = t.clientX - nr.left;
    const half = liquidW / 2;
    const maxLeft = Math.max(0, nr.width - liquidW);
    const left = Math.min(maxLeft, Math.max(0, localX - half));
    setLiquidX(left);
    setHover(nearestIndex(left + half));
  }

  function onEnd() {
    if (!dragging) return;
    dragging = false;
    liquid.style.transition = '';

    const buttons = getButtons();
    const idx = hoverIndex >= 0
      ? hoverIndex
      : buttons.findIndex((b) => b.classList.contains('active'));
    const target = buttons[idx];

    if (target) {
      const name = target.dataset.nav;
      if (name && name !== state.screen) {
        navigate(name);
        hoverIndex = -1;
        return;
      }
    }
    restoreToActive();
    hoverIndex = -1;
  }

  nav.addEventListener('touchstart', onStart, { passive: true });
  nav.addEventListener('touchmove', onMove, { passive: false });
  nav.addEventListener('touchend', onEnd);
  nav.addEventListener('touchcancel', onEnd);
}
function buildSplashLogo() {
  const svg = $('#splash-svg');
  const word1 = 'PIKA';
  const word2 = 'MOVIE';
  const step = 52;
  const gap = 36;
  const total1 = word1.length * step;
  const total2 = word2.length * step;
  const width = total1 + gap + total2;
  const startX = (560 - width) / 2 + step / 2;
  let out = '';
  let idx = 0;
  [...word1].forEach((ch, i) => {
    out += `<text x="${startX + i * step}" y="78" text-anchor="middle" style="animation-delay:${0.5 + idx * 0.09}s">${ch}</text>`;
    idx++;
  });
  [...word2].forEach((ch, i) => {
    out += `<text class="red" x="${startX + total1 + gap + i * step}" y="78" text-anchor="middle" style="animation-delay:${0.5 + idx * 0.09}s">${ch}</text>`;
    idx++;
  });
  svg.innerHTML = out;
}

async function runSplash() {
  const splash = $('#splash');
  await wait(CONFIG.SPLASH_MS);
  splash.classList.add('hide');
  setTimeout(() => splash.remove(), 1000);
}

function init() {
  loadState();
  document.documentElement.classList.add('no-trans');
  applyTheme(state.theme, false);
  hydrateIcons();
  applyStaticTranslations();
buildSplashLogo();
initEventListeners();
initPullToRefresh();
initNavLiquid();
initNavSwipe();
  requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.remove('no-trans')));
  const startScreen = location.hash.replace('#', '');
  navigate(SCREENS.includes(startScreen) && startScreen !== 'collection' ? startScreen : 'home', { silent: true });
  loadHome();
  runSplash();
  if ('serviceWorker' in navigator && false) { /* intentionally disabled */ }
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000" id="meta-theme-color">
<meta name="description" content="PIKA MOVIE - a Liquid Glass movie streaming web app">
<link rel="icon" href="https://raw.githubusercontent.com/itsmems97/itsmems97.github.io/refs/heads/main/Pika-Movie.png">
<title>PIKA MOVIE</title>
<style>
/* ==========================================================
   PIKA MOVIE — iOS "Liquid Glass" design system
   ========================================================== */
:root {
  --accent: #e50914;
  --accent-soft: rgba(229, 9, 20, 0.18);
  --accent-glow: rgba(229, 9, 20, 0.45);
  --bg: #000000;
  --bg-glow-1: rgba(229, 9, 20, 0.22);
  --bg-glow-2: rgba(120, 20, 60, 0.18);
  --glass: rgba(255, 255, 255, 0.06);
  --glass-strong: rgba(255, 255, 255, 0.11);
  --glass-border: rgba(255, 255, 255, 0.12);
  --glass-highlight: rgba(255, 255, 255, 0.22);
  --text: #ffffff;
  --text-2: #a8a8a8;
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.55), 0 2px 10px rgba(229, 9, 20, 0.06);
  --shadow-lg: 0 24px 80px rgba(0, 0, 0, 0.7), 0 4px 24px rgba(229, 9, 20, 0.1);
  --skeleton-a: rgba(255, 255, 255, 0.05);
  --skeleton-b: rgba(255, 255, 255, 0.14);
  --blob-1: #e50914;
  --blob-2: #6a11cb;
  --blob-3: #ff5a36;
  --blob-opacity: 0.32;
  --nav-bg: rgba(20, 20, 22, 0.55);
  --sheet-bg: rgba(18, 18, 20, 0.78);
  --input-bg: rgba(255, 255, 255, 0.08);
  --radius-sm: 16px;
  --radius: 24px;
  --radius-lg: 32px;
  --radius-xl: 40px;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-std: cubic-bezier(0.4, 0, 0.2, 1);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --nav-h: 76px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Naskh Arabic", "Noto Nastaliq Urdu", Tahoma, sans-serif;
  --font-display: Impact, "Haettenschweiler", "Arial Narrow Bold", "Anton", sans-serif;
}

html[data-theme="light"] {
  --bg: #f5f5f7;
  --bg-glow-1: rgba(255, 255, 255, 0.95);
  --bg-glow-2: rgba(229, 9, 20, 0.08);
  --glass: rgba(255, 255, 255, 0.65);
  --glass-strong: rgba(255, 255, 255, 0.85);
  --glass-border: rgba(0, 0, 0, 0.08);
  --glass-highlight: rgba(255, 255, 255, 0.95);
  --text: #0a0a0a;
  --text-2: #6b6b6b;
  --shadow: 0 10px 40px rgba(20, 20, 40, 0.12), 0 2px 10px rgba(229, 9, 20, 0.05);
  --shadow-lg: 0 24px 80px rgba(20, 20, 40, 0.2), 0 4px 24px rgba(229, 9, 20, 0.08);
  --skeleton-a: rgba(0, 0, 0, 0.05);
  --skeleton-b: rgba(0, 0, 0, 0.12);
  --blob-opacity: 0.22;
  --nav-bg: rgba(255, 255, 255, 0.7);
  --sheet-bg: rgba(250, 250, 252, 0.85);
  --input-bg: rgba(0, 0, 0, 0.05);
}

*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.4s var(--ease-std), color 0.4s var(--ease-std);
}
body.no-scroll { overflow: hidden; }
body::before {
  content: "";
  position: fixed; inset: 0; z-index: -3;
  background:
    radial-gradient(ellipse 80% 55% at 50% -10%, var(--bg-glow-1), transparent 70%),
    radial-gradient(ellipse 60% 50% at 100% 100%, var(--bg-glow-2), transparent 70%),
    var(--bg);
  transition: background 0.4s var(--ease-std);
}
h1, h2, h3, h4, p { margin: 0; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
input, select { font: inherit; color: inherit; }
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
svg { display: block; flex-shrink: 0; }
ul { list-style: none; margin: 0; padding: 0; }

*, *::before, *::after { transition-property: background-color, border-color, color, fill, stroke, box-shadow, opacity, transform; transition-duration: 0.4s; transition-timing-function: var(--ease-std); }
.no-trans, .no-trans * { transition: none !important; }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 12px; }
::selection { background: var(--accent); color: #fff; }
::-webkit-scrollbar { width: 0; height: 0; }

/* ---------- Urdu / RTL layout ---------- */
html[dir="rtl"] .theme-toggle { right: auto; left: 14px; }
html[dir="rtl"] .brand-pill { left: auto; right: 14px; padding: 0 8px 0 16px; }
html[dir="rtl"] .hero-dots { right: auto; left: 20px; }
html[dir="rtl"] .select-wrap select { padding: 0 16px 0 38px; }
html[dir="rtl"] .select-wrap .chev { right: auto; left: 12px; }
html[dir="rtl"] .see-all svg { transform: scaleX(-1); }
html[dir="rtl"] .setting-row > svg { transform: scaleX(-1); }
html[dir="rtl"] #player-back svg { transform: scaleX(-1); }
html[dir="rtl"] .col-head .icon-btn svg { transform: scaleX(-1); }
html[dir="rtl"] .hero-title, html[dir="rtl"] .splash-svg { direction: ltr; }
html[dir="rtl"] body { line-height: 1.6; }

/* ---------- Background blobs & noise ---------- */
.blobs { position: fixed; inset: 0; z-index: -2; overflow: hidden; pointer-events: none; }
.blob {
  position: absolute; width: 55vmax; height: 55vmax; border-radius: 50%;
  filter: blur(80px); opacity: var(--blob-opacity); will-change: transform;
}
.blob.b1 { background: radial-gradient(circle at 30% 30%, var(--blob-1), transparent 65%); top: -20vmax; left: -15vmax; animation: blobMove1 26s ease-in-out infinite alternate; }
.blob.b2 { background: radial-gradient(circle at 60% 40%, var(--blob-2), transparent 65%); bottom: -25vmax; right: -20vmax; animation: blobMove2 32s ease-in-out infinite alternate; }
.blob.b3 { background: radial-gradient(circle at 50% 50%, var(--blob-3), transparent 65%); top: 35%; left: 40%; width: 40vmax; height: 40vmax; animation: blobMove3 38s ease-in-out infinite alternate; }
@keyframes blobMove1 { 0% { transform: translate(0,0) scale(1); border-radius: 50% 45% 55% 50%; } 50% { transform: translate(18vmax, 12vmax) scale(1.2); border-radius: 40% 60% 45% 55%; } 100% { transform: translate(6vmax, 26vmax) scale(0.95); border-radius: 55% 45% 60% 40%; } }
@keyframes blobMove2 { 0% { transform: translate(0,0) scale(1); } 50% { transform: translate(-20vmax, -14vmax) scale(1.15); border-radius: 45% 55% 40% 60%; } 100% { transform: translate(-8vmax, -28vmax) scale(1.05); } }
@keyframes blobMove3 { 0% { transform: translate(-10vmax, 0) scale(0.9); } 50% { transform: translate(12vmax, -10vmax) scale(1.25); } 100% { transform: translate(-6vmax, 14vmax) scale(1); } }
.noise {
  position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: 0.05; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

/* ---------- Glass primitives ---------- */
.glass {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  backdrop-filter: blur(30px) saturate(180%);
  box-shadow: var(--shadow), inset 0 1px 0 var(--glass-highlight);
}
.glass-strong { background: var(--glass-strong); }
.btn {
  position: relative; overflow: hidden; isolation: isolate;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; min-width: 44px; padding: 0 22px;
  border-radius: 999px; font-weight: 700; font-size: 15px; letter-spacing: 0.2px;
  transition: transform 0.4s var(--ease-spring), background 0.3s, box-shadow 0.4s;
  user-select: none; -webkit-user-select: none;
}
.btn:hover { transform: translateY(-2px) scale(1.02); }
.btn:active { transform: scale(0.95); }
.btn-primary { background: #fff; color: #000; box-shadow: 0 8px 30px rgba(255,255,255,0.18); }
html[data-theme="light"] .btn-primary { background: #0a0a0a; color: #fff; box-shadow: 0 8px 30px rgba(0,0,0,0.25); }
.btn-accent { background: var(--accent); color: #fff; box-shadow: 0 8px 30px var(--accent-glow); }
.btn-glass { background: var(--glass); border: 1px solid var(--glass-border); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); box-shadow: inset 0 1px 0 var(--glass-highlight); }
.btn-round { width: 46px; height: 46px; padding: 0; border-radius: 50%; }
.btn-sm { min-height: 36px; padding: 0 14px; font-size: 13px; }
.hero .btn-glass { color: #fff; background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.25); }
.ripple-circle {
  position: absolute; border-radius: 50%; pointer-events: none; z-index: -1;
  background: rgba(255,255,255,0.45); transform: scale(0);
  animation: rippleAnim 0.7s var(--ease-out) forwards;
}
html[data-theme="light"] .btn-primary .ripple-circle { background: rgba(255,255,255,0.35); }
@keyframes rippleAnim { to { transform: scale(1); opacity: 0; } }
.icon-btn {
  position: relative; overflow: hidden; display: grid; place-items: center;
  width: 44px; height: 44px; border-radius: 50%;
  transition: transform 0.4s var(--ease-spring), background 0.3s;
}
.icon-btn:active { transform: scale(0.88); }

.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 16px;
  border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap;
  background: var(--glass); border: 1px solid var(--glass-border);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  transition: transform 0.35s var(--ease-spring), background 0.3s, color 0.3s;
}
.chip:active { transform: scale(0.94); }
.chip.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 6px 22px var(--accent-glow); }
.chip .x { opacity: 0.6; display: grid; place-items: center; width: 22px; height: 22px; margin-right: -8px; border-radius: 50%; }
.chip .x:hover { opacity: 1; background: var(--glass-strong); }

.select-wrap { position: relative; display: inline-flex; align-items: center; }
.select-wrap select {
  appearance: none; -webkit-appearance: none; min-height: 40px; padding: 0 38px 0 16px;
  border-radius: 999px; font-weight: 600; font-size: 13px; cursor: pointer;
  background: var(--glass); border: 1px solid var(--glass-border); color: var(--text);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
}
.select-wrap select option { color: #000; background: #fff; }
.select-wrap .chev { position: absolute; right: 12px; pointer-events: none; opacity: 0.7; }

/* ---------- Splash ---------- */
#splash {
  position: fixed; inset: 0; z-index: 9999; background: #000;
  display: grid; place-items: center; overflow: hidden;
  transition: opacity 0.8s var(--ease-out), transform 0.8s var(--ease-out), visibility 0.8s;
}
#splash::before {
  content: ""; position: absolute; width: 90vmax; height: 90vmax; border-radius: 50%;
  background: radial-gradient(circle, rgba(229,9,20,0.35), transparent 60%);
  animation: splashGlow 3s ease-in-out infinite alternate;
}
@keyframes splashGlow { from { transform: scale(0.8); opacity: 0.5; } to { transform: scale(1.1); opacity: 1; } }
#splash.hide { opacity: 0; transform: scale(1.25); visibility: hidden; pointer-events: none; }
.splash-inner { position: relative; display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 20px; text-align: center; }
.splash-logo-img {
  width: min(52vw, 240px); height: auto; border-radius: 28%;
  filter: drop-shadow(0 0 40px rgba(229,9,20,0.6));
  opacity: 0; transform: scale(0.3);
  animation: logoZoom 0.9s var(--ease-spring) 0.1s forwards,
             logoPulse 2.2s ease-in-out 1s infinite;
}
@keyframes logoZoom { to { opacity: 1; transform: scale(1); } }
@keyframes logoPulse {
  0%, 100% { filter: drop-shadow(0 0 40px rgba(229,9,20,0.6)); }
  50%      { filter: drop-shadow(0 0 80px rgba(229,9,20,0.95))
                    drop-shadow(0 0 24px rgba(255,255,255,0.35)); }
}
.splash-svg { width: min(86vw, 520px); height: auto; overflow: visible; }
.splash-svg text {
  font-family: var(--font-display); font-size: 74px; letter-spacing: 6px; fill: #fff;
  opacity: 0; transform-box: fill-box; transform-origin: center; transform: scale(0.2);
  animation: letterZoom 0.6s var(--ease-spring) forwards;
}
.splash-svg text.red { fill: var(--accent); }
@keyframes letterZoom { 0% { opacity: 0; transform: scale(0.2); } 100% { opacity: 1; transform: scale(1); } }
.splash-sub { color: #a8a8a8; letter-spacing: 6px; font-size: 11px; text-transform: uppercase; opacity: 0; animation: fadeIn 0.8s ease 1.1s forwards; }
@keyframes fadeIn { to { opacity: 1; } }

/* ---------- App shell ---------- */
#app { min-height: 100vh; min-height: 100dvh; position: relative; }
.theme-toggle {
  position: fixed; z-index: 800; top: calc(14px + var(--safe-top)); right: 14px;
  width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; overflow: hidden;
}
.theme-toggle .ico { position: absolute; transition: transform 0.6s var(--ease-spring), opacity 0.4s; }
html[data-theme="dark"] .theme-toggle .ico-sun { transform: rotate(-90deg) scale(0); opacity: 0; }
html[data-theme="light"] .theme-toggle .ico-moon { transform: rotate(90deg) scale(0); opacity: 0; }
.brand-pill {
  position: fixed; z-index: 800; top: calc(14px + var(--safe-top)); left: 14px;
  height: 48px; padding: 0 16px 0 8px; border-radius: 999px; display: flex; align-items: center; gap: 8px;
}
.brand-pill img { width: 32px; height: 32px; border-radius: 10px; object-fit: cover; }
.brand-pill span { font-family: var(--font-display); letter-spacing: 2px; font-size: 18px; }
.brand-pill span b { color: var(--accent); font-weight: 400; }

main { position: relative; padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 40px); }
.screen { display: none; min-height: 100vh; }
.screen.active { display: block; animation: screenIn 0.5s var(--ease-out) both; }
@keyframes screenIn { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: translateY(0); } }
.screen-pad { padding: calc(86px + var(--safe-top)) 16px 20px; max-width: 1400px; margin: 0 auto; }
.screen-title { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 4px; }
.screen-sub { color: var(--text-2); font-size: 14px; margin-bottom: 18px; }

/* ---------- Bottom navigation ---------- */
.bottom-nav {
  position: fixed; z-index: 700; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + var(--safe-bottom)); width: min(calc(100% - 28px), 460px);
  height: 68px; border-radius: 999px; padding: 6px;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
  background: var(--nav-bg); border: 1px solid var(--glass-border);
  -webkit-backdrop-filter: blur(34px) saturate(190%); backdrop-filter: blur(34px) saturate(190%);
  box-shadow: var(--shadow-lg), inset 0 1px 0 var(--glass-highlight);
  touch-action: pan-y;
}
.nav-btn {
  position: relative; overflow: hidden; border-radius: 999px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; color: var(--text-2);
  font-size: 10.5px; font-weight: 700; min-height: 44px;
  transition: color 0.3s, background 0.4s, transform 0.4s var(--ease-spring);
}
.nav-btn:active { transform: scale(0.9); }
.nav-btn { z-index: 1; }
.nav-btn.active { color: var(--text); }
.nav-btn.active svg { color: var(--accent); transform: translateY(-1px) scale(1.12); }
.nav-btn svg { transition: transform 0.4s var(--ease-spring), color 0.3s; }

/* ---------- Liquid blob indicator (slides between tabs) ---------- */
.nav-liquid {
  position: absolute;
  top: 6px;
  left: 0;
  height: calc(100% - 12px);
  width: 0;
  border-radius: 999px;
  background:
    radial-gradient(ellipse 60% 90% at 30% 15%, rgba(255,255,255,0.32), transparent 60%),
    linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0.04));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.4),
    inset 0 -1px 0 rgba(0,0,0,0.15),
    0 8px 26px rgba(0,0,0,0.42),
    0 0 34px rgba(229,9,20,0.28);
  pointer-events: none;
  z-index: 0;
  will-change: transform, width, filter;
  transform-origin: center center;
  transition:
    transform 0.65s cubic-bezier(0.34, 1.5, 0.6, 1),
    width 0.55s cubic-bezier(0.34, 1.5, 0.6, 1);
}
html[data-theme="light"] .nav-liquid {
  background:
    radial-gradient(ellipse 60% 90% at 30% 15%, rgba(255,255,255,0.98), transparent 60%),
    linear-gradient(135deg, rgba(255,255,255,0.95), rgba(245,245,250,0.78));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.98),
    0 8px 26px rgba(20,20,40,0.16),
    0 0 30px rgba(229,9,20,0.16);
}
.nav-liquid.morph {
  animation: navLiquidMorph 0.7s cubic-bezier(0.34, 1.5, 0.6, 1);
}
@keyframes navLiquidMorph {
  0%   { border-radius: 999px;                 filter: blur(0px) brightness(1); }
  25%  { border-radius: 50% 999px 50% 999px / 999px; filter: blur(0.7px) brightness(1.18); }
  55%  { border-radius: 999px 50% 999px 50% / 999px; filter: blur(0.5px) brightness(1.1); }
  100% { border-radius: 999px;                 filter: blur(0px) brightness(1); }
}
@media (prefers-reduced-motion: reduce) {
  .nav-liquid { transition: none; }
  .nav-liquid.morph { animation: none; }
}

/* ---------- Hero ---------- */
.hero { position: relative; width: 100%; height: min(86vh, 760px); min-height: 520px; overflow: hidden; color: #fff; border-radius: 0 0 var(--radius-xl) var(--radius-xl); }
.hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center top; opacity: 0; transform: scale(1.18); transition: opacity 1.2s var(--ease-std); will-change: transform, opacity; }
.hero-bg.active { opacity: 1; animation: kenBurns 9s ease-out forwards; }
@keyframes kenBurns {
  0%   { transform: scale(1.18) translate(0, 0); }
  100% { transform: scale(1.02) translate(-1.5%, -1%); }
}
.hero::after {
  content: ""; position: absolute; inset: 0; z-index: 1;
  background:
    linear-gradient(to top, var(--bg) 0%, rgba(0,0,0,0.0) 45%),
    linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.25) 55%, rgba(0,0,0,0.45) 100%);
}
html[data-theme="light"] .hero::after { background: linear-gradient(to top, var(--bg) 0%, rgba(0,0,0,0) 35%), linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.2) 55%, rgba(0,0,0,0.4) 100%); }
.hero-content {
  position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; padding: 0 20px 56px; max-width: 900px;
  display: flex; flex-direction: column; gap: 14px;
}
.hero-content.swap { animation: heroSwap 0.8s var(--ease-out); }
@keyframes heroSwap { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
.hero-badge { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; font-size: 12px; font-weight: 700; border-radius: 999px; letter-spacing: 1px; text-transform: uppercase; }
.hero-title { font-family: var(--font-display); font-size: clamp(44px, 11vw, 96px); line-height: 0.95; letter-spacing: 1.5px; text-transform: uppercase; text-shadow: 0 6px 40px rgba(0,0,0,0.6); }
.hero-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.88); }
.hero-meta .dot { opacity: 0.6; }
.hero-meta .rate { display: inline-flex; align-items: center; gap: 4px; color: #ffd54a; }
.hero-desc { font-size: 15px; line-height: 1.5; color: rgba(255,255,255,0.8); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; max-width: 620px; }
.hero-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
.hero-dots { position: absolute; z-index: 3; bottom: 24px; right: 20px; display: flex; gap: 6px; }
.hero-dot { width: 8px; height: 8px; border-radius: 999px; background: rgba(255,255,255,0.35); transition: width 0.5s var(--ease-spring), background 0.3s; }
.hero-dot.active { width: 26px; background: #fff; }

/* ---------- Rows & cards ---------- */
.row { margin-top: 28px; }
.row-head { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; margin-bottom: 12px; max-width: 1400px; margin-left: auto; margin-right: auto; }
.row-title { font-size: 21px; font-weight: 800; letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px; }
.row-title svg { color: var(--accent); }
.see-all { font-size: 13px; font-weight: 700; color: var(--text-2); display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 6px; border-radius: 999px; }
.see-all:hover { color: var(--accent); }
.row-scroll { display: flex; gap: 14px; overflow-x: auto; padding: 8px 16px 22px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
.row-scroll > * { scroll-snap-align: start; }
.row-scroll::after { content: ""; flex: 0 0 4px; }

.card {
  position: relative; flex: 0 0 auto; width: 138px; aspect-ratio: 2/3; border-radius: var(--radius);
  overflow: hidden; cursor: pointer; background: var(--glass);
  border: 1px solid var(--glass-border); box-shadow: var(--shadow);
  transition: transform 0.5s var(--ease-spring), box-shadow 0.5s var(--ease-out);
  -webkit-user-select: none; user-select: none;
}
.grid .card { width: 100%; }
.card img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: cover; opacity: 0; filter: blur(14px) saturate(1.4); transform: scale(1.08); transition: opacity 0.8s var(--ease-std), filter 1s var(--ease-out), transform 1.1s var(--ease-out); will-change: filter, opacity, transform; }
.card img.loaded { opacity: 1; filter: blur(0) saturate(1); transform: scale(1); }
.card-placeholder { position: absolute; inset: 0; z-index: 0; background-size: cover; background-position: center; background-color: var(--skeleton-a); filter: blur(16px) saturate(1.5); transform: scale(1.18); transition: opacity 0.9s var(--ease-std); pointer-events: none; }
.card.img-ready .card-placeholder { opacity: 0; }
.card:active { transform: scale(0.94); box-shadow: 0 0 0 2px var(--accent-glow), var(--shadow-lg); }
@media (hover: hover) and (pointer: fine) {
  .card:hover { transform: scale(1.06); box-shadow: var(--shadow-lg), 0 0 0 1px var(--glass-highlight); z-index: 2; }
  .card:hover img { transform: scale(1.08); }
}
.card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: 3; pointer-events: none; box-shadow: inset 0 1px 0 var(--glass-highlight), inset 0 0 0 1px rgba(255,255,255,0.06); }
.card-fade { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 10px 10px; z-index: 2; background: linear-gradient(to top, rgba(0,0,0,0.92), rgba(0,0,0,0.55) 55%, transparent); color: #fff; }
.card-title { font-size: 12.5px; font-weight: 700; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-sub { font-size: 10.5px; color: rgba(255,255,255,0.7); margin-top: 2px; }
.badge-rate { position: absolute; z-index: 4; top: 8px; right: 8px; display: inline-flex; align-items: center; gap: 3px; height: 24px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 800; color: #fff; background: rgba(0,0,0,0.45); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.18); }
.badge-rate svg { color: #ffd54a; }
.badge-type { position: absolute; z-index: 4; top: 8px; left: 8px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 9.5px; font-weight: 800; letter-spacing: 0.6px; color: #fff; background: var(--accent); display: grid; place-items: center; }
.card-progress { position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,0.22); }
.card-progress i { display: block; height: 100%; background: var(--accent); width: 0; border-radius: 0 4px 4px 0; box-shadow: 0 0 10px var(--accent-glow); transition: width 1s var(--ease-out); }
.card-trash { position: absolute; z-index: 6; bottom: 10px; right: 8px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: rgba(0,0,0,0.55); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.2); transition: transform 0.4s var(--ease-spring), background 0.3s; }
.card-trash:hover { background: var(--accent); transform: scale(1.1); }
.card-trash:active { transform: scale(0.85); }
.card.wide { width: 250px; aspect-ratio: 16/9; }
.card.removing { transform: scale(0.6) !important; opacity: 0; }

.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 16px; } .card { width: 160px; } }
@media (min-width: 1024px) { .grid { grid-template-columns: repeat(6, 1fr); gap: 20px; } .card { width: 180px; } .screen-pad { padding-left: 32px; padding-right: 32px; } .row-head, .row-scroll { padding-left: 32px; padding-right: 32px; } }

/* ---------- Skeletons ---------- */
.skeleton { position: relative; overflow: hidden; background: var(--skeleton-a); border-radius: var(--radius); }
.skeleton::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, var(--skeleton-b), transparent); animation: shimmer 1.4s infinite; }
@keyframes shimmer { to { transform: translateX(100%); } }
.skel-card { flex: 0 0 auto; width: 138px; aspect-ratio: 2/3; }
.grid .skel-card { width: 100%; }
.skel-line { height: 14px; border-radius: 8px; margin: 8px 0; }
.skel-hero { height: min(86vh, 760px); min-height: 520px; border-radius: 0 0 var(--radius-xl) var(--radius-xl); }

/* ---------- Search ---------- */
.search-bar { position: relative; display: flex; align-items: center; height: 60px; border-radius: 999px; padding: 0 8px 0 22px; gap: 12px; }
.search-bar:focus-within { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
.search-bar input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; font-size: 17px; font-weight: 500; height: 100%; color: var(--text); }
.search-bar input::placeholder { color: var(--text-2); }
.search-clear { width: 44px; height: 44px; border-radius: 50%; display: none; place-items: center; background: var(--glass-strong); }
.search-clear.show { display: grid; animation: popIn 0.4s var(--ease-spring); }
@keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
.filter-bar { display: flex; gap: 10px; align-items: center; overflow-x: auto; padding: 16px 0 6px; }
.section-head { display: flex; align-items: center; justify-content: space-between; margin: 22px 0 12px; }
.section-head h2 { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.section-head h2 svg { color: var(--accent); }
.link-btn { font-size: 13px; font-weight: 700; color: var(--accent); min-height: 44px; padding: 0 8px; border-radius: 12px; }
.chip-wrap { display: flex; flex-wrap: wrap; gap: 10px; }
.trend-list { display: flex; flex-direction: column; gap: 10px; }
.trend-item { display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 18px; border-radius: var(--radius-sm); font-weight: 600; text-align: left; transition: transform 0.4s var(--ease-spring); }
.trend-item:active { transform: scale(0.97); }
.trend-item .num { color: var(--accent); font-family: var(--font-display); font-size: 22px; width: 26px; }
.trend-item .fire { margin-left: auto; color: var(--accent); opacity: 0.8; }
.empty-state { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 50px 20px; }
.empty-state svg { width: 180px; height: 180px; margin-bottom: 8px; }
.empty-state h3 { font-size: 20px; font-weight: 800; }
.empty-state p { color: var(--text-2); max-width: 320px; font-size: 14px; line-height: 1.5; }
.results-count { font-size: 13px; color: var(--text-2); margin: 14px 2px 12px; }

/* ---------- My list toolbar ---------- */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 18px; }
.toolbar .spacer { flex: 1; }

/* ---------- Profile ---------- */
.profile-head { display: flex; align-items: center; gap: 18px; margin-bottom: 22px; }
.avatar { width: 84px; height: 84px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 10px 40px var(--accent-glow); }
.profile-name { font-size: 26px; font-weight: 800; }
.profile-mail { color: var(--text-2); font-size: 14px; margin-top: 2px; }
.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 720px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }
.stat-card { border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden; }
.stat-card .stat-ico { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); margin-bottom: 4px; }
.stat-card .val { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
.stat-card .lbl { font-size: 12px; color: var(--text-2); font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; }
.history-list { display: flex; flex-direction: column; gap: 10px; }
.history-item { display: flex; align-items: center; gap: 14px; padding: 10px; border-radius: var(--radius); cursor: pointer; transition: transform 0.4s var(--ease-spring); }
.history-item:active { transform: scale(0.98); }
.history-item img { width: 60px; height: 88px; border-radius: 14px; object-fit: cover; flex-shrink: 0; background: var(--skeleton-a); }
.history-info { flex: 1; min-width: 0; }
.history-title { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.history-time { font-size: 12px; color: var(--text-2); margin: 3px 0 8px; }
.bar { height: 5px; border-radius: 999px; background: var(--glass-strong); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--accent), #ff5a36); transition: width 1.1s var(--ease-out); }
.settings-list { display: flex; flex-direction: column; gap: 10px; }
.setting-row { display: flex; align-items: center; gap: 14px; min-height: 68px; padding: 12px 16px; border-radius: var(--radius); width: 100%; text-align: left; }
button.setting-row { transition: transform 0.4s var(--ease-spring); }
button.setting-row:active { transform: scale(0.98); }
.setting-ico { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex-shrink: 0; }
.setting-text { flex: 1; min-width: 0; }
.setting-label { font-weight: 700; font-size: 15px; }
.setting-desc { font-size: 12.5px; color: var(--text-2); margin-top: 2px; line-height: 1.35; }
.switch { position: relative; width: 54px; height: 32px; border-radius: 999px; background: var(--glass-strong); border: 1px solid var(--glass-border); flex-shrink: 0; transition: background 0.4s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 3px 10px rgba(0,0,0,0.35); transition: transform 0.45s var(--ease-spring); }
.switch.on { background: var(--accent); border-color: var(--accent); }
.switch.on::after { transform: translateX(22px); }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--glass-strong); border: 1px solid var(--glass-border); }
.seg button { min-height: 34px; min-width: 56px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--text-2); transition: background 0.35s, color 0.35s; }
.seg button.active { background: var(--accent); color: #fff; box-shadow: 0 4px 14px var(--accent-glow); }
.danger .setting-ico { background: rgba(255,69,58,0.15); color: #ff453a; }
.about-card { border-radius: var(--radius); padding: 22px; text-align: center; margin-top: 12px; }
.about-card img { width: 72px; height: 72px; margin: 0 auto 10px; border-radius: 22px; }
.about-card p { color: var(--text-2); font-size: 13px; line-height: 1.5; }

/* ---------- Bottom sheet (detail) ---------- */
#sheet-backdrop {
  position: fixed; inset: 0; z-index: 900; background: rgba(0,0,0,0.55);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  opacity: 0; visibility: hidden; transition: opacity 0.5s var(--ease-std), visibility 0.5s;
}
#sheet-backdrop.open { opacity: 1; visibility: visible; }
#sheet {
  position: fixed; z-index: 910; left: 50%; bottom: 0; width: min(100%, 860px); max-height: 94vh; max-height: 94dvh;
  transform: translate(-50%, 105%); overflow-y: auto; overflow-x: hidden;
  background: var(--sheet-bg); border: 1px solid var(--glass-border); border-bottom: 0;
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  -webkit-backdrop-filter: blur(40px) saturate(190%); backdrop-filter: blur(40px) saturate(190%);
  box-shadow: var(--shadow-lg), inset 0 1px 0 var(--glass-highlight);

  overscroll-behavior: contain;
}
#sheet.open { transform: translate(-50%, 0); }
.sheet-grab { position: absolute; z-index: 5; top: 8px; left: 50%; transform: translateX(-50%); width: 44px; height: 5px; border-radius: 999px; background: rgba(255,255,255,0.5); }
.sheet-close { position: absolute; z-index: 6; top: 16px; right: 16px; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: rgba(0,0,0,0.4); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.22); }
.sheet-hero { position: relative; height: 330px; overflow: hidden; background: var(--skeleton-a); }
.sheet-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.sheet-hero iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; transition: opacity 1s; }
.sheet-hero iframe.on { opacity: 1; }
.sheet-hero::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to top, var(--sheet-bg-solid, var(--bg)) 0%, rgba(0,0,0,0.0) 70%), linear-gradient(to top, rgba(0,0,0,0.35), transparent 50%); }
html[data-theme="light"] .sheet-hero::after { background: linear-gradient(to top, #fafafc 2%, rgba(250,250,252,0) 70%); }
html[data-theme="dark"] .sheet-hero::after { background: linear-gradient(to top, #121214 2%, rgba(18,18,20,0) 75%); }
.sheet-body { position: relative; z-index: 2; margin-top: -70px; padding: 0 20px calc(40px + var(--safe-bottom)); }
.sheet-title { font-size: 30px; font-weight: 900; letter-spacing: -0.6px; line-height: 1.1; }
.sheet-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 12px 0 18px; font-size: 14px; font-weight: 600; color: var(--text-2); }
.sheet-meta .rate { display: inline-flex; align-items: center; gap: 4px; color: #f5b301; font-weight: 800; }
.hd-badge { padding: 2px 8px; border-radius: 8px; border: 1.5px solid var(--text-2); font-size: 11px; font-weight: 800; letter-spacing: 0.5px; }
.sheet-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; align-items: center; }
.sheet-actions .btn-primary { flex: 1 1 140px; }
.sheet-desc { font-size: 15px; line-height: 1.65; color: var(--text); opacity: 0.88; margin-bottom: 20px; }
.sheet-h { font-size: 17px; font-weight: 800; margin: 24px 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cast-row { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 6px; }
.cast-item { flex: 0 0 auto; width: 76px; text-align: center; }
.cast-avatar { width: 68px; height: 68px; border-radius: 50%; margin: 0 auto 8px; display: grid; place-items: center; font-weight: 800; font-size: 20px; color: #fff; overflow: hidden; border: 2px solid var(--glass-border); }
.cast-avatar img { width: 100%; height: 100%; object-fit: cover; }
.cast-name { font-size: 11.5px; font-weight: 600; line-height: 1.25; }
.muted { color: var(--text-2); font-size: 13px; }
.genre-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
.genre-row .chip { min-height: 32px; font-size: 12px; }
.sheet-more .row-scroll { padding-left: 0; padding-right: 0; }
.sheet-more .card { width: 118px; }
.sheet-more .card .card-fade { display: none; }

/* ---------- Episodes ---------- */
.ep-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 24px 0 14px; }
.ep-head h3 { font-size: 17px; font-weight: 800; }
.ep-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 640px) { .ep-grid { grid-template-columns: repeat(2, 1fr); } }
.ep-card { display: flex; gap: 12px; padding: 10px; border-radius: var(--radius); cursor: pointer; align-items: center; transition: transform 0.4s var(--ease-spring); }
.ep-card:active { transform: scale(0.97); }
.ep-thumb { position: relative; width: 120px; aspect-ratio: 16/9; border-radius: 16px; overflow: hidden; flex-shrink: 0; background: var(--skeleton-b); }
.ep-thumb img { width: 100%; height: 100%; object-fit: cover; filter: saturate(1.1); }
.ep-thumb .num { position: absolute; left: 8px; top: 6px; font-family: var(--font-display); font-size: 20px; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
.ep-thumb .play-ov { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,0.3); color: #fff; opacity: 0; transition: opacity 0.3s; }
.ep-card:hover .play-ov { opacity: 1; }
.ep-thumb .bar { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 0; height: 4px; }
.ep-info { flex: 1; min-width: 0; }
.ep-title { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ep-dur { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.ep-play { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; flex-shrink: 0; box-shadow: 0 6px 20px var(--accent-glow); }

/* ---------- Player ---------- */
#player {
  position: fixed; inset: 0; z-index: 1000; background: #000; color: #fff;
  display: flex; flex-direction: column; opacity: 0; visibility: hidden; transform: scale(1.04);
  transition: opacity 0.5s var(--ease-out), transform 0.6s var(--ease-out), visibility 0.5s;
}
#player.open { opacity: 1; visibility: visible; transform: scale(1); }
.player-top { display: flex; align-items: center; gap: 12px; padding: calc(10px + var(--safe-top)) 12px 10px; background: linear-gradient(to bottom, rgba(0,0,0,0.85), rgba(0,0,0,0.0)); z-index: 3; position: relative; }
.player-top .title { flex: 1; min-width: 0; font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player-top .title small { display: block; font-weight: 500; font-size: 12px; opacity: 0.65; margin-top: 1px; }
.player-frame { position: relative; flex: 1; background: #050505; overflow: hidden; }
.player-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
.player-loading { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(circle, rgba(229,9,20,0.15), #000 70%); transition: opacity 0.6s, visibility 0.6s; }
.player-loading.done { opacity: 0; visibility: hidden; pointer-events: none; }
.spinner { width: 58px; height: 58px; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0 15%, var(--accent) 100%); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px)); mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px)); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.player-loading p { font-size: 13px; opacity: 0.7; letter-spacing: 1px; }
.player-bottom { display: flex; align-items: center; gap: 10px; padding: 10px 12px calc(12px + var(--safe-bottom)); background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0)); z-index: 3; position: relative; }
.provider-row { flex: 1; display: flex; gap: 8px; overflow-x: auto; min-width: 0; padding: 2px; }
.provider-row .chip { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.18); color: #fff; }
.player-bottom .icon-btn { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); color: #fff; }
.player-top .icon-btn { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); color: #fff; }
#ep-drawer { position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; max-height: 72%; overflow-y: auto; padding: 20px 16px calc(24px + var(--safe-bottom)); border-radius: var(--radius-xl) var(--radius-xl) 0 0; background: rgba(20,20,22,0.82); -webkit-backdrop-filter: blur(40px) saturate(190%); backdrop-filter: blur(40px) saturate(190%); border-top: 1px solid var(--glass-border); transform: translateY(105%); transition: transform 0.6s cubic-bezier(0.34, 1.35, 0.64, 1); color: #fff; }
#ep-drawer.open { transform: translateY(0); }
#ep-drawer .ep-title { color: #fff; }

/* ---------- Player error state ---------- */
.player-error {
  position: absolute; inset: 0; z-index: 4;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; text-align: center; padding: 32px 24px;
  background: radial-gradient(circle at center, rgba(229,9,20,0.18), #000 70%);
  color: #fff; opacity: 0; visibility: hidden;
  transition: opacity 0.5s var(--ease-std), visibility 0.5s;
}
.player-error.show { opacity: 1; visibility: visible; }
.player-error svg { width: 84px; height: 84px; color: var(--accent); opacity: 0.9; }
.player-error h3 { font-size: 22px; font-weight: 800; letter-spacing: -0.3px; }
.player-error p { font-size: 14px; opacity: 0.75; max-width: 400px; line-height: 1.5; }
.player-error .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
.player-error .btn { min-height: 44px; padding: 0 22px; border-radius: 999px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
.player-error .btn-retry { background: var(--accent); color: #fff; box-shadow: 0 8px 28px var(--accent-glow); }
.player-error .btn-secondary { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); color: #fff; }

/* ---------- Toast & particles ---------- */
#toast-wrap { position: fixed; z-index: 2000; left: 0; right: 0; bottom: calc(100px + var(--safe-bottom)); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 16px; }
.toast { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 20px; border-radius: 999px; font-size: 14px; font-weight: 600; max-width: 100%; background: var(--nav-bg); animation: toastIn 0.55s var(--ease-spring) both; }
.toast svg { color: var(--accent); }
.toast.out { animation: toastOut 0.4s var(--ease-std) forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateY(40px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(24px) scale(0.95); } }
.particle { position: fixed; z-index: 3000; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; background: var(--accent); animation: particle 0.8s var(--ease-out) forwards; }
@keyframes particle { to { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }
.pop { animation: heartPop 0.6s var(--ease-spring); }
@keyframes heartPop { 0% { transform: scale(1); } 40% { transform: scale(1.5); } 100% { transform: scale(1); } }
.is-fav { color: var(--accent); }
.is-saved { color: var(--accent); }

/* ---------- Misc ---------- */
.fade-up { animation: screenIn 0.6s var(--ease-out) both; }
.hidden { display: none !important; }
.error-box { margin: 20px 16px; padding: 22px; border-radius: var(--radius); text-align: center; }
.error-box p { color: var(--text-2); margin: 8px 0 16px; font-size: 14px; }
.col-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.col-head h1 { font-size: 26px; font-weight: 800; }
.footer-note { text-align: center; color: var(--text-2); font-size: 12px; padding: 30px 16px 10px; }

/* ---------- Pull to refresh ---------- */
#ptr {
  position: fixed; z-index: 500; left: 50%; top: 0;
  transform: translate(-50%, -80px);
  width: 46px; height: 46px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--glass-strong);
  border: 1px solid var(--glass-border);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  backdrop-filter: blur(24px) saturate(180%);
  box-shadow: var(--shadow);
  pointer-events: none;
  transition: transform 0.35s var(--ease-spring), opacity 0.3s, background-color 0.3s, border-color 0.3s;
  opacity: 0;
}
#ptr.visible { opacity: 1; }
#ptr.ready { background: var(--accent); border-color: var(--accent); box-shadow: 0 8px 26px var(--accent-glow); }
#ptr svg { width: 22px; height: 22px; color: var(--text); }
#ptr.ready svg { color: #fff; }
#ptr.spinning svg { animation: spin 0.9s linear infinite; }
#ptr.pulse svg { animation: ptrPop 0.5s var(--ease-spring); }
@keyframes ptrPop { 0% { transform: scale(0.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }

@media (min-width: 900px) {
  .hero-content { padding-left: 48px; padding-bottom: 80px; }

}

/* ============================================
   SECTION 2 — STATE MANAGEMENT
   ============================================ */
const state = {
  screen: 'home',
  prevScreen: 'home',
  theme: 'dark',
  lang: 'en',
  list: [],
  watched: [],
  recent: [],
  favs: [],
  epProgress: {},
  settings: { autoplayTrailer: true, dataSaver: false },
  itemCache: new Map(),
  homeItems: [],
  rows: {},
  heroItems: [],
  heroIndex: 0,
  heroTimer: null,
  demoMode: false,
  homeLoaded: false,
  search: { query: '', filter: 'all', genre: '', results: [], token: 0, loading: false },
  listView: { sort: 'recent', filter: 'all' },
  detail: { item: null, season: 1, token: 0 },
  player: { item: null, season: 1, episode: 1, providers: [], startedAt: 0, timer: null, mode: 'movie', baseProgress: 0 },
  collection: { title: '', items: [] }
};

/* ============================================
   SECTION 3 — LOCAL STORAGE HELPERS
   ============================================ */
const store = {
  get(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (err) { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (err) { /* storage unavailable */ }
  },
  raw(key, fallback) {
    try { const v = localStorage.getItem(key); return v === null ? fallback : v; } catch (err) { return fallback; }
  },
  setRaw(key, value) {
    try { localStorage.setItem(key, value); } catch (err) { /* ignore */ }
  }
};

function loadState() {
  const K = CONFIG.KEYS;
  const theme = store.raw(K.theme, 'dark');
  state.theme = theme === 'light' ? 'light' : 'dark';
  const lang = store.raw(K.lang, 'en');
  state.lang = lang === 'ur' ? 'ur' : 'en';
  const list = store.get(K.list, []);
  state.list = Array.isArray(list) ? list.map(String) : [];
  const watched = store.get(K.watched, []);
  state.watched = Array.isArray(watched) ? watched : [];
  const recent = store.get(K.recent, []);
  state.recent = Array.isArray(recent) ? recent : [];
  const favs = store.get(K.favs, []);
  state.favs = Array.isArray(favs) ? favs.map(String) : [];
  const ep = store.get(K.ep, {});
  state.epProgress = ep && typeof ep === 'object' ? ep : {};
  const settings = store.get(K.settings, null);
  if (settings && typeof settings === 'object') {
    state.settings = { autoplayTrailer: settings.autoplayTrailer !== false, dataSaver: !!settings.dataSaver };
  }
  const cache = store.get(K.cache, {});
  if (cache && typeof cache === 'object') {
    Object.keys(cache).forEach((id) => state.itemCache.set(String(id), cache[id]));
  }
}
function saveList() { store.set(CONFIG.KEYS.list, state.list); }
function saveWatched() { store.set(CONFIG.KEYS.watched, state.watched); }
function saveRecent() { store.set(CONFIG.KEYS.recent, state.recent); }
function saveFavs() { store.set(CONFIG.KEYS.favs, state.favs); }
function saveEp() { store.set(CONFIG.KEYS.ep, state.epProgress); }
function saveSettings() { store.set(CONFIG.KEYS.settings, state.settings); }
function persistCacheFor(ids) {
  const out = {};
  ids.forEach((id) => {
    const it = state.itemCache.get(String(id));
    if (it) out[id] = slimItem(it);
  });
  const old = store.get(CONFIG.KEYS.cache, {});
  store.set(CONFIG.KEYS.cache, Object.assign({}, old, out));
}
function slimItem(it) {
  return { id: it.id, title: it.title, poster: it.poster, backdrop: it.backdrop, year: it.year, type: it.type, mediaType: it.mediaType, rating: it.rating, description: it.description, genres: it.genres, duration: it.duration };
}

/* ============================================
   SECTION 4 — API LAYER
   ============================================ */
const apiCache = new Map();

async function apiGet(path, params = {}, { cache = true } = {}) {
  const qs = new URLSearchParams(params).toString();
  const url = `${CONFIG.API_BASE}${path}${qs ? '?' + qs : ''}`;
  if (cache && apiCache.has(url)) return apiCache.get(url);
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), CONFIG.FETCH_TIMEOUT);
  try {
    const res = await fetch(url, { signal: ctrl.signal, headers: { Accept: 'application/json' } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data && data.ok === false) throw new Error(data.error || 'API error');
    if (cache) apiCache.set(url, data);
    return data;
  } finally {
    clearTimeout(timer);
  }
}

function normalizeItem(raw) {
  if (!raw) return null;
  const mediaType = String(raw.mediaType || raw.type || 'movie').toLowerCase();
  const isTv = /tv|series|show/.test(mediaType);
  const item = {
    id: String(raw.id),
    title: raw.title || raw.name || 'Untitled',
    poster: raw.poster || '',
    backdrop: raw.backdrop || raw.poster || '',
    year: raw.year || '',
    type: isTv ? 'tv' : 'movie',
    mediaType: isTv ? 'tv' : 'movie',
    rating: raw.rating !== undefined && raw.rating !== null && raw.rating !== '' ? Number(raw.rating) : 0,
    description: raw.description || raw.overview || '',
    genres: Array.isArray(raw.genres) ? raw.genres.map((g) => (typeof g === 'string' ? g : g && g.name)).filter(Boolean) : [],
    duration: raw.duration || '',
    trailerKey: raw.trailerKey || '',
    cast: Array.isArray(raw.cast) ? raw.cast : null,
    seasons: raw.seasons || raw.numberOfSeasons || null
  };
  const prev = state.itemCache.get(item.id);
  if (prev) {
    ['poster', 'backdrop', 'description', 'duration', 'trailerKey'].forEach((k) => { if (!item[k] && prev[k]) item[k] = prev[k]; });
    if (!item.genres.length && prev.genres && prev.genres.length) item.genres = prev.genres;
    if (!item.cast && prev.cast) item.cast = prev.cast;
  }
  state.itemCache.set(item.id, item);
  return item;
}

function debounce(fn, ms) {
  let id;
  return (...args) => { clearTimeout(id); id = setTimeout(() => fn(...args), ms); };
}

function imgUrl(url, kind = 'poster') {
  if (!url) return '';
  if (state.settings.dataSaver && /image\.tmdb\.org/.test(url)) {
    return url.replace(/\/(original|w1280|w780|w500)\//, kind === 'backdrop' ? '/w780/' : '/w342/');

function formatRating(r) {
  const n = Number(r);
  return n > 0 ? n.toFixed(1) : '–';
}

function timeAgo(ts) {
  const ur = state.lang === 'ur';
  const diff = Math.max(0, Date.now() - ts);
  const m = Math.floor(diff / 60000);
  if (m < 1) return t('justNow');
  if (m < 60) return ur ? `${m} منٹ ${t('ago')}` : `${m}m ${t('ago')}`;
  const h = Math.floor(m / 60);
  if (h < 24) return ur ? `${h} گھنٹے ${t('ago')}` : `${h}h ${t('ago')}`;
  const d = Math.floor(h / 24);
  if (d < 30) return ur ? `${d} دن ${t('ago')}` : `${d}d ${t('ago')}`;
  return new Date(ts).toLocaleDateString(ur ? 'ur-PK' : 'en-US', { month: 'short', day: 'numeric' });
}

function formatDuration(totalSec) {
  const mins = Math.floor(totalSec / 60);
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  if (h > 0) return `${h}${t('hrs')} ${m}${t('mins')}`;
  return `${m}${t('mins')}`;
}

function parseDurationMinutes(d, isTv) {
  if (!d) return isTv ? CONFIG.EPISODE_RUNTIME_MIN : CONFIG.DEFAULT_RUNTIME_MIN;
  if (typeof d === 'number') return d;
  const str = String(d);
  let total = 0;
  const h = str.match(/(\d+)\s*h/i);
  const m = str.match(/(\d+)\s*m/i);
  if (h) total += parseInt(h[1], 10) * 60;
  if (m) total += parseInt(m[1], 10);
  if (!h && !m) { const n = parseInt(str, 10); if (!isNaN(n)) total = n; }
  return total || (isTv ? CONFIG.EPISODE_RUNTIME_MIN : CONFIG.DEFAULT_RUNTIME_MIN);
}

function displayDuration(d) {
  if (!d) return '';
  if (typeof d === 'number') return `${Math.floor(d / 60) ? Math.floor(d / 60) + 'h ' : ''}${d % 60}m`;
  return String(d);
}

function hueFromString(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;

/* Ripple effect */
function attachRipple(e) {
  const el = e.target.closest('.ripple, .btn, .icon-btn, .nav-btn');
  if (!el || prefersReducedMotion()) return;
  const rect = el.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height) * 2.2;
  const circle = document.createElement('span');
  circle.className = 'ripple-circle';
  circle.style.width = circle.style.height = size + 'px';
  circle.style.left = (e.clientX - rect.left - size / 2) + 'px';
  circle.style.top = (e.clientY - rect.top - size / 2) + 'px';
  if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
  el.style.overflow = 'hidden';
  el.appendChild(circle);
  setTimeout(() => circle.remove(), 750);
}

/* Particle burst for heart / bookmark taps */
function burst(el) {
  if (prefersReducedMotion() || !el) return;
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  const colors = ['#e50914', '#ff5a36', '#ffd54a', '#ff7a90'];
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('span');
    const angle = (Math.PI * 2 * i) / 12 + Math.random() * 0.4;
    const dist = 34 + Math.random() * 30;
    p.className = 'particle';
    p.style.left = cx - 4 + 'px';
    p.style.top = cy - 4 + 'px';
    p.style.background = colors[i % colors.length];
    p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 850);
  }
  el.classList.remove('pop');
  void el.offsetWidth;
  el.classList.add('pop');
}

/* Toasts */
function toast(message, iconName = 'check') {
  const wrap = $('#toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast glass';
  el.setAttribute('role', 'status');
  el.innerHTML = `${icon(iconName, 20)}<span>${escapeHtml(message)}</span>`;
  wrap.appendChild(el);
  while (wrap.children.length > 3) wrap.firstChild.remove();
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 420);
  }, CONFIG.TOAST_MS);
}

   ============================================ */
const SCREENS = ['home', 'search', 'list', 'profile', 'collection'];

function navigate(name, opts = {}) {
  if (!SCREENS.includes(name)) name = 'home';
  closeSheet(true);
  const prev = state.screen;
  if (prev !== name) state.prevScreen = prev;
  state.screen = name;
  SCREENS.forEach((s) => {
    const el = $('#screen-' + s);
    if (el) el.classList.toggle('active', s === name);
  });
  let activeNavBtn = null;
$$('.nav-btn').forEach((b) => {
  const isActive = b.dataset.nav === name;
  b.classList.toggle('active', isActive);
  if (isActive) activeNavBtn = b;
});
if (activeNavBtn) moveNavLiquid(activeNavBtn);
  window.scrollTo({ top: 0, behavior: 'auto' });
  if (name === 'home') { if (state.homeLoaded) startHeroTimer(); } else stopHeroTimer();
  if (name === 'search') renderSearchScreen();
  if (name === 'list') renderListScreen();
  if (name === 'profile') renderProfileScreen();
  if (name === 'collection') renderCollectionScreen();
  if (!opts.silent) {
    try { history.replaceState({ screen: name }, '', '#' + name); } catch (err) { /* file:// may block */ }
  }
}

function posterCard(item, opts = {}) {
  const { progress = null, removable = false, wide = false, showType = true } = opts;
  const src = imgUrl(wide ? (item.backdrop || item.poster) : item.poster, wide ? 'backdrop' : 'poster');
  const low = lowResUrl(src);
  const typeLabel = item.type === 'tv' ? 'TV' : '';
  return `<article class="card ${wide ? 'wide' : ''}" data-action="open-detail" data-id="${escapeHtml(item.id)}" tabindex="0" role="button" aria-label="${escapeHtml(item.title)}">
    ${low ? `<span class="card-placeholder" style="background-image:url('${escapeHtml(low)}')" aria-hidden="true"></span>` : `<span class="card-placeholder" aria-hidden="true"></span>`}
    ${src ? `<img src="${escapeHtml(src)}" alt="${escapeHtml(item.title)}" loading="lazy" decoding="async" onload="onImgLoad(this)" onerror="this.style.display='none'">` : ''}
    ${showType && typeLabel ? `<span class="badge-type">${typeLabel}</span>` : ''}
    ${item.rating > 0 ? `<span class="badge-rate">${icon('star-filled', 11)}${formatRating(item.rating)}</span>` : ''}
    <div class="card-fade">
      <div class="card-title">${escapeHtml(item.title)}</div>
      <div class="card-sub">${escapeHtml(item.year || '')}${item.year && item.type === 'tv' ? ' • ' : ''}${item.type === 'tv' ? t('tv') : ''}</div>
    </div>
    ${removable ? `<button class="card-trash" data-action="remove-list" data-id="${escapeHtml(item.id)}" aria-label="${t('remove')} ${escapeHtml(item.title)}">${icon('trash', 16)}</button>` : ''}
    ${progress !== null ? `<div class="card-progress" aria-hidden="true"><i data-w="${clamp(progress, 0, 100)}"></i></div>` : ''}
  </article>`;
}

function skeletonRow(n = 7) {
  return `<div class="row"><div class="row-head"><div class="skeleton skel-line" style="width:150px;height:22px"></div></div><div class="row-scroll">${Array.from({ length: n }, () => '<div class="skeleton skel-card"></div>').join('')}</div></div>`;
}
function renderHomeSkeleton() {
  $('#hero-wrap').innerHTML = '<div class="skeleton skel-hero"></div>';
  $('#home-rows').innerHTML = skeletonRow() + skeletonRow() + skeletonRow();
}

async function loadHome(force = false) {
  if (state.homeLoaded && !force) return;
  renderHomeSkeleton();
  try {
    const items = await fetchHome();
    if (!items.length) throw new Error('empty');
    state.homeItems = items;
    state.demoMode = false;
  } catch (err) {
    state.homeItems = demoItems();
    state.demoMode = true;
    toast(t('demoMode'), 'info');
  }
  state.homeLoaded = true;
  buildRows();
  renderHome();
}

function buildRows() {
  const items = state.homeItems;
  const byYear = items.slice().sort((a, b) => Number(b.year || 0) - Number(a.year || 0));
  const byRating = items.slice().sort((a, b) => b.rating - a.rating);
  let tv = items.filter((i) => i.type === 'tv');
  if (tv.length < 4) tv = items.filter((i) => i.type === 'tv').concat(byRating.filter((i) => i.type !== 'tv')).slice(0, 12);
  state.rows = {
    trending: items.slice(0, 20),
    newReleases: byYear.slice(0, 20),
    topRated: byRating.slice(0, 20),
    popularTv: tv.slice(0, 20)
  };
  const withBackdrop = items.filter((i) => i.backdrop);
  state.heroItems = (withBackdrop.length ? withBackdrop : items).slice(0, 6);
  state.heroIndex = 0;
}

function renderHome() {
  renderHero();
  renderRows();
  if (state.screen === 'home') startHeroTimer();
}

function renderHero() {
  const wrap = $('#hero-wrap');
  const items = state.heroItems;
  if (!items.length) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = `<section class="hero" aria-label="Featured">
    ${items.map((it, i) => `<div class="hero-bg ${i === 0 ? 'active' : ''}" data-hero-bg="${i}" style="background-image:url('${escapeHtml(imgUrl(it.backdrop, 'backdrop'))}')" role="img" aria-label="${escapeHtml(it.title)}"></div>`).join('')}
    <div class="hero-content" id="hero-content"></div>
    <div class="hero-dots" id="hero-dots">${items.map((_, i) => `<button class="hero-dot ${i === 0 ? 'active' : ''}" data-action="hero-go" data-index="${i}" aria-label="Show featured title ${i + 1}"></button>`).join('')}</div>
  </section>`;
  fillHeroContent(false);
}

function fillHeroContent(animate = true) {
  const it = state.heroItems[state.heroIndex];
  const box = $('#hero-content');
  if (!it || !box) return;
  const saved = inList(it.id);
  box.innerHTML = `
    <span class="hero-badge glass">${icon('fire', 14)}<span>${t('trending')}</span></span>
    <h1 class="hero-title">${escapeHtml(it.title)}</h1>
    <div class="hero-meta">
      <span>${escapeHtml(it.year || '')}</span><span class="dot">•</span>
      <span>${it.type === 'tv' ? t('tvShows') : t('movies')}</span>
      ${it.genres && it.genres[0] ? `<span class="dot">•</span><span>${escapeHtml(it.genres[0])}</span>` : ''}
      ${it.rating > 0 ? `<span class="dot">•</span><span class="rate">${icon('star-filled', 14)}${formatRating(it.rating)}</span>` : ''}
    </div>
    <p class="hero-desc">${escapeHtml(it.description)}</p>
    <div class="hero-actions">
      <button class="btn btn-primary ripple" data-action="play" data-id="${escapeHtml(it.id)}" aria-label="${t('play')} ${escapeHtml(it.title)}">${icon('play', 20)}<span>${t('play')}</span></button>
      <button class="btn btn-glass ripple" data-action="toggle-list" data-id="${escapeHtml(it.id)}" aria-label="${t('myList')}">${icon(saved ? 'check' : 'plus', 20)}<span>${t('myList')}</span></button>
      <button class="btn btn-glass btn-round ripple" data-action="open-detail" data-id="${escapeHtml(it.id)}" aria-label="${t('info')}">${icon('info', 22)}</button>
    </div>`;
  if (animate) { box.classList.remove('swap'); void box.offsetWidth; box.classList.add('swap'); }
  $$('.hero-bg').forEach((el, i) => el.classList.toggle('active', i === state.heroIndex));
  $$('.hero-dot').forEach((el, i) => el.classList.toggle('active', i === state.heroIndex));
}

function heroGo(i) {
  if (!state.heroItems.length) return;
  state.heroIndex = (i + state.heroItems.length) % state.heroItems.length;
  fillHeroContent(true);
  startHeroTimer();
}
function startHeroTimer() {
  stopHeroTimer();
  if (state.heroItems.length < 2) return;
  state.heroTimer = setInterval(() => {
    if (document.hidden || state.screen !== 'home' || $('#sheet').classList.contains('open') || $('#player').classList.contains('open')) return;
    state.heroIndex = (state.heroIndex + 1) % state.heroItems.length;
    fillHeroContent(true);
  }, CONFIG.HERO_INTERVAL);
}
function stopHeroTimer() { if (state.heroTimer) { clearInterval(state.heroTimer); state.heroTimer = null; } }

function rowHtml(titleKey, iconName, items, collectionKey, opts = {}) {
  if (!items.length) return '';
  const cards = items.map((it) => posterCard(it, opts.cardOpts ? opts.cardOpts(it) : {})).join('');
  return `<section class="row fade-up" aria-label="${t(titleKey)}">
    <div class="row-head">
      <h2 class="row-title">${icon(iconName, 22)}<span>${t(titleKey)}</span></h2>
      <button class="see-all ripple" data-action="see-all" data-key="${collectionKey}" aria-label="${t('seeAll')} ${t(titleKey)}"><span>${t('seeAll')}</span>${icon('forward', 16)}</button>
    </div>
    <div class="row-scroll">${cards}</div>
  </section>`;
}

function continueItems() {
  return state.watched
    .filter((w) => w.progress > 1 && w.progress < 95)
    .sort((a, b) => b.timestamp - a.timestamp)
    .map((w) => {
      const base = getItem(w.id) || normalizeItem({ id: w.id, title: w.title, poster: w.poster, backdrop: w.backdrop, type: w.mediaType || w.type || 'movie', year: w.year });
      return Object.assign({}, base, { _progress: w.progress });
    });
}

function renderRows() {
  const host = $('#home-rows');
  const cont = continueItems();
  let html = '';
  html += rowHtml('trending', 'fire', state.rows.trending, 'trending');
  html += rowHtml('newReleases', 'sparkle', state.rows.newReleases, 'newReleases');
  if (cont.length) html += rowHtml('continueWatching', 'clock', cont, 'continue', { cardOpts: (it) => ({ progress: it._progress }) });
  html += rowHtml('topRated', 'star', state.rows.topRated, 'topRated');
  html += rowHtml('popularTv', 'tv', state.rows.popularTv, 'popularTv');
  html += `<p class="footer-note">PIKA MOVIE • ${state.demoMode ? t('demoMode') : 'Liquid Glass'}</p>`;
  host.innerHTML = html;
  animateBars(host);
}

function openCollection(key) {
  let items = [];
  let title = '';
  if (key === 'continue') { items = continueItems(); title = t('continueWatching'); }
  else if (key === 'history') { items = state.watched.map((w) => getItem(w.id) || normalizeItem({ id: w.id, title: w.title, poster: w.poster, type: w.mediaType || 'movie' })); title = t('watchHistory'); }
  else {
    const map = { trending: 'trending', newReleases: 'newReleases', topRated: 'topRated', popularTv: 'popularTv' };
    items = state.rows[map[key]] || [];
    title = t(map[key] || 'trending');
  }
  state.collection = { title, items, key };
  navigate('collection');
}

function renderCollectionScreen() {
  const { title, items, key } = state.collection;
  const body = $('#collection-body');
  body.innerHTML = `
    <div class="col-head"><button class="icon-btn glass ripple" data-action="collection-back" aria-label="Back">${icon('back', 22)}</button><h1>${escapeHtml(title)}</h1></div>
    ${items.length ? `<div class="grid">${items.map((it) => posterCard(it, key === 'continue' ? { progress: it._progress } : {})).join('')}</div>` : emptyState('search', t('noResults'), t('noResultsSub'))}`;
  animateBars(body);
}

function emptyState(kind, title, sub, ctaHtml = '') {
  return `<div class="empty-state fade-up">${kind === 'list' ? illustrationList() : illustrationSearch()}<h3>${escapeHtml(title)}</h3><p>${escapeHtml(sub)}</p>${ctaHtml}</div>`;
}

/* ============================================
   SECTION 9 — SEARCH SCREEN RENDER
   ============================================ */
function renderSearchScreen() {
  const input = $('#search-input');
  input.placeholder = t('searchPlaceholder');
  input.value = state.search.query;
  $('#search-clear').classList.toggle('show', !!state.search.query);
  renderSearchFilters();
  renderSearchBody();
}

function renderSearchFilters() {
  const f = state.search.filter;
  const genreOptions = `<option value="">${t('genre')}</option>` + CONFIG.GENRES.map((g) => `<option value="${g}" ${state.search.genre === g ? 'selected' : ''}>${g}</option>`).join('');
  $('#search-filters').innerHTML = `
    <button class="chip ripple ${f === 'all' ? 'active' : ''}" data-action="search-filter" data-filter="all">${t('all')}</button>
    <button class="chip ripple ${f === 'movie' ? 'active' : ''}" data-action="search-filter" data-filter="movie">${icon('film', 15)}${t('movies')}</button>
    <button class="chip ripple ${f === 'tv' ? 'active' : ''}" data-action="search-filter" data-filter="tv">${icon('tv', 15)}${t('tvShows')}</button>
    <span class="select-wrap"><select id="genre-select" aria-label="${t('genre')}">${genreOptions}</select><span class="chev">${icon('chevron-down', 16)}</span></span>`;
  $('#genre-select').addEventListener('change', (e) => {
    state.search.genre = e.target.value;
    renderSearchBody();
  });
}

function renderSearchBody() {
  const body = $('#search-body');
  const s = state.search;
  if (!s.query.trim()) {
    const recent = state.recent;
    let html = '';
    if (recent.length) {
      html += `<div class="section-head"><h2>${icon('clock', 20)}${t('recentSearches')}</h2><button class="link-btn" data-action="clear-recent">${t('clearAll')}</button></div>
        <div class="chip-wrap">${recent.map((r, i) => `<span class="chip"><button class="ripple" style="min-height:36px;border-radius:999px;overflow:hidden" data-action="use-recent" data-q="${escapeHtml(r.query)}" aria-label="Search ${escapeHtml(r.query)}">${escapeHtml(r.query)}</button><button class="x" data-action="remove-recent" data-index="${i}" aria-label="Remove ${escapeHtml(r.query)}">${icon('close', 12)}</button></span>`).join('')}</div>`;
    }
    html += `<div class="section-head"><h2>${icon('fire', 20)}${t('trendingSearches')}</h2></div>
      <div class="trend-list">${CONFIG.TRENDING_SEARCHES.map((q, i) => `<button class="trend-item glass ripple" data-action="use-recent" data-q="${escapeHtml(q)}"><span class="num">${i + 1}</span><span>${escapeHtml(q)}</span><span class="fire">${icon('fire', 18)}</span></button>`).join('')}</div>`;
    body.innerHTML = html;
    return;
  }
  if (s.loading) {
    body.innerHTML = `<div class="grid" style="margin-top:18px">${Array.from({ length: 12 }, () => '<div class="skeleton skel-card"></div>').join('')}</div>`;
    return;
  }
  let results = s.results.slice();
  if (s.filter !== 'all') results = results.filter((r) => r.type === s.filter);
  if (s.genre) {
    const g = s.genre.toLowerCase();
    results = results.filter((r) => (r.genres || []).some((x) => String(x).toLowerCase().includes(g)) || (r.description || '').toLowerCase().includes(g));
  }
  if (!results.length) {
    body.innerHTML = emptyState('search', t('noResults'), t('noResultsSub'));
    return;
  }
  body.innerHTML = `<p class="results-count">${results.length} ${t('results')}</p><div class="grid">${results.map((r) => posterCard(r)).join('')}</div>`;
}

async function runSearch(q) {
  const query = q.trim();
  state.search.query = q;
  const token = ++state.search.token;
  $('#search-clear').classList.toggle('show', !!q);
  if (!query) { state.search.results = []; state.search.loading = false; renderSearchBody(); return; }
  state.search.loading = true;
  renderSearchBody();
  try {
    const items = await fetchSearch(query);
    if (token !== state.search.token) return;
    state.search.results = items;
    addRecentSearch(query);
  } catch (err) {
    if (token !== state.search.token) return;
    const ql = query.toLowerCase();
    state.search.results = state.homeItems.filter((i) => i.title.toLowerCase().includes(ql));
  }
  state.search.loading = false;
  renderSearchBody();
}
const debouncedSearch = debounce(runSearch, CONFIG.SEARCH_DEBOUNCE);

function addRecentSearch(query) {
  const q = query.trim();
  if (q.length < 2) return;
  state.recent = state.recent.filter((r) => r.query.toLowerCase() !== q.toLowerCase());
  state.recent.unshift({ query: q, timestamp: Date.now() });
  state.recent = state.recent.slice(0, CONFIG.MAX_RECENT);
  saveRecent();
}

/* ============================================
   SECTION 10 — MY LIST SCREEN RENDER
   ============================================ */
function listItems() {
  let items = state.list.map((id) => getItem(id)).filter(Boolean);
  const f = state.listView.filter;
  if (f !== 'all') items = items.filter((i) => i.type === f);
  const s = state.listView.sort;
  if (s === 'az') items.sort((a, b) => a.title.localeCompare(b.title));
  else if (s === 'rating') items.sort((a, b) => b.rating - a.rating);
  else if (s === 'year') items.sort((a, b) => Number(b.year || 0) - Number(a.year || 0));
  return items;
}

function renderListScreen() {
  const v = state.listView;
  $('#list-sub').textContent = `${state.list.length} ${state.list.length === 1 ? 'title' : 'titles'}`;
  $('#list-toolbar').innerHTML = `
    <button class="chip ripple ${v.filter === 'all' ? 'active' : ''}" data-action="list-filter" data-filter="all">${t('all')}</button>
    <button class="chip ripple ${v.filter === 'movie' ? 'active' : ''}" data-action="list-filter" data-filter="movie">${t('movies')}</button>
    <button class="chip ripple ${v.filter === 'tv' ? 'active' : ''}" data-action="list-filter" data-filter="tv">${t('tvShows')}</button>
    <span class="spacer"></span>
    <span class="select-wrap"><select id="list-sort" aria-label="${t('sortBy')}">
      <option value="recent" ${v.sort === 'recent' ? 'selected' : ''}>${t('recentlyAdded')}</option>
      <option value="az" ${v.sort === 'az' ? 'selected' : ''}>${t('az')}</option>
      <option value="rating" ${v.sort === 'rating' ? 'selected' : ''}>${t('rating')}</option>
      <option value="year" ${v.sort === 'year' ? 'selected' : ''}>${t('year')}</option>
    </select><span class="chev">${icon('chevron-down', 16)}</span></span>`;
  $('#list-sort').addEventListener('change', (e) => { state.listView.sort = e.target.value; renderListBody(); });
  renderListBody();
}

function renderListBody() {
  const body = $('#list-body');
  if (!state.list.length) {
    body.innerHTML = emptyState('list', t('emptyList'), t('emptyListSub'), `<button class="btn btn-accent ripple" data-action="go-home" style="margin-top:8px">${icon('film', 18)}<span>${t('browse')}</span></button>`);
    return;
  }
  const items = listItems();
  if (!items.length) { body.innerHTML = emptyState('search', t('noResults'), t('noResultsSub')); return; }
  body.innerHTML = `<div class="grid">${items.map((it) => posterCard(it, { removable: true })).join('')}</div>`;
}

function toggleList(id, sourceEl) {
  id = String(id);
  const item = getItem(id);
  if (inList(id)) {
    state.list = state.list.filter((x) => x !== id);
    toast(t('removed'), 'bookmark-filled');
  } else {
    state.list.unshift(id);
    if (item) persistCacheFor([id]);
    toast(t('added'), 'check');
    burst(sourceEl);
  }
  saveList();
  refreshListUi(id);
}

function removeFromList(id, cardEl) {
  id = String(id);
  const finish = () => {
    state.list = state.list.filter((x) => x !== id);
    saveList();
    toast(t('removed'), 'trash');
    if (state.screen === 'list') renderListScreen();
    refreshListUi(id);
  };
  if (cardEl && !prefersReducedMotion()) { cardEl.classList.add('removing'); setTimeout(finish, 350); } else finish();
}

function refreshListUi(id) {
  if (state.screen === 'home') fillHeroContent(false);
  if (state.screen === 'list') { $('#list-sub').textContent = `${state.list.length} ${state.list.length === 1 ? 'title' : 'titles'}`; renderListBody(); }
  if (state.screen === 'profile') renderProfileScreen();
  const sheetBtn = $('#sheet-list-btn');
  if (sheetBtn && state.detail.item && String(state.detail.item.id) === String(id)) {
    const saved = inList(id);
    sheetBtn.innerHTML = `${icon(saved ? 'bookmark-filled' : 'plus', 20)}<span>${t('myList')}</span>`;
    sheetBtn.classList.toggle('is-saved', saved);
  }
}

      <button class="setting-row glass ripple" data-action="toggle-about"><span class="setting-ico">${icon('info', 22)}</span><div class="setting-text"><div class="setting-label">${t('about')}</div><div class="setting-desc">${t('aboutDesc')}</div></div>${icon('chevron-down', 20)}</button>
    </div>

    <p class="footer-note">PIKA MOVIE v1.0</p>`;

}

function statCard(ico, value, label) {
  return `<div class="stat-card glass"><span class="stat-ico">${icon(ico, 20)}</span><span class="val">${escapeHtml(value)}</span><span class="lbl">${escapeHtml(label)}</span></div>`;
}

function historyRow(w) {
  const item = getItem(w.id);
  const poster = imgUrl(w.poster || (item && item.poster), 'poster');
  const epInfo = w.mediaType === 'tv' && w.season ? ` • S${w.season}:E${w.episode}` : '';
  return `<div class="history-item glass" data-action="open-detail" data-id="${escapeHtml(w.id)}" role="button" tabindex="0" aria-label="${escapeHtml(w.title)}">

    <button class="icon-btn ripple" data-action="remove-history" data-id="${escapeHtml(w.id)}" aria-label="${t('remove')} ${escapeHtml(w.title)}">${icon('close', 18)}</button>
